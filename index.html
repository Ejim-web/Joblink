<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <title>JobLink – Africa's Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border: #2a2a35;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
        }
        body.light {
            --bg-primary: #f5f7fb;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: all 0.2s ease; padding-bottom: 70px; }
        
        .navbar {
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 0.75rem;
        }
        .bottom-nav button i { font-size: 22px; }
        .bottom-nav button.active { color: var(--accent); background: var(--bg-primary); }
        
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; padding-bottom: 80px; }
        
        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .badge-verified { background: var(--success); color: white; }
        .badge-featured { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #0c0a2a; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--bg-primary) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.5rem; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .btn-primary { background: var(--accent-gradient); color: white; border: none; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 0.6rem 1rem; border-radius: 0.75rem; cursor: pointer; }
        
        .toast { position: fixed; bottom: 80px; left: 20px; background: var(--accent); color: white; padding: 0.75rem 1.25rem; border-radius: 2rem; z-index: 2000; font-size: 0.85rem; }
        
        .search-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 2rem; background: var(--bg-primary); color: var(--text-primary); margin-bottom: 1rem; }
        
        @media (max-width: 768px) { .container { padding: 0.75rem; padding-bottom: 80px; } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter, Timestamp, addDoc, onSnapshot, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Collections
        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const postsCol = collection(db, "posts");
        const applicationsCol = collection(db, "applications");
        const chatRoomsCol = collection(db, "chatRooms");
        const messagesCol = collection(db, "messages");

        let currentUser = null, currentUserId = null;
        let currentUserData = null;
        let currentView = 'feed';
        
        // Pagination states
        let lastPostDoc = null, lastJobDoc = null, isLoading = false;
        let feedUnsubscribe = null;

        function showToast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }
        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            const diff = Math.floor((Date.now() - date) / 1000 / 60);
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${diff}m ago`;
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
            return `${Math.floor(diff / 1440)}d ago`;
        }
        
        // Theme
        function initTheme() { const saved = localStorage.getItem('theme'); if (saved === 'light') document.body.classList.add('light'); }
        window.toggleTheme = () => { document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark'); };
        initTheme();

        function navigateTo(view) {
            currentView = view;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                if (btn.dataset.nav === view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (view === 'feed') loadFeed();
            if (view === 'jobs') loadJobs();
            if (view === 'network') loadNetwork();
            if (view === 'chat') loadChatRooms();
            if (view === 'profile') loadProfile();
            if (view === 'admin' && currentUserData?.role === 'Admin') loadAdminDashboard();
        }

        // Render Auth
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem;">
                    <div style="background:var(--bg-card); border-radius:1.5rem; max-width:460px; width:100%; padding:2rem;">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="font-size:3rem; background:var(--accent-gradient); width:80px; height:80px; display:inline-flex; align-items:center; justify-content:center; border-radius:1.5rem; margin-bottom:1rem;">
                                <i class="fas fa-briefcase" style="color:white; font-size:2rem;"></i>
                            </div>
                            <h1 style="font-size:2rem; font-weight:800;">JobLink</h1>
                            <p style="color:var(--text-secondary);">Africa's Professional Network</p>
                        </div>
                        <div style="display:flex; gap:0.75rem; background:var(--bg-primary); border-radius:1rem; padding:0.25rem; margin-bottom:2rem;">
                            <button class="tab-btn active" data-tab="login" style="flex:1; background:var(--bg-card); border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Sign in</button>
                            <button class="tab-btn" data-tab="signup" style="flex:1; background:transparent; border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Create account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="password" id="loginPassword" placeholder="Password" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <button id="doLogin" style="width:100%; padding:0.8rem; border-radius:0.75rem; background:var(--accent-gradient); color:white; font-weight:600; border:none;">Sign in →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" placeholder="Full name" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="email" id="signupEmail" placeholder="Email" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="password" id="signupPassword" placeholder="Password" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <select id="signupRole" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                                <option>Job Seeker</option><option>Employer</option>
                            </select>
                            <button id="doSignup" style="width:100%; padding:0.8rem; border-radius:0.75rem; background:var(--accent-gradient); color:white; font-weight:600; border:none;">Create account</button>
                        </div>
                    </div>
                </div>
            `;
            
            const loginPanel = document.getElementById("loginPanel"), signupPanel = document.getElementById("signupPanel");
            const loginTab = document.querySelector('[data-tab="login"]'), signupTab = document.querySelector('[data-tab="signup"]');
            loginTab.onclick = () => { loginPanel.style.display = "block"; signupPanel.style.display = "none"; loginTab.style.background = "var(--bg-card)"; signupTab.style.background = "transparent"; };
            signupTab.onclick = () => { loginPanel.style.display = "none"; signupPanel.style.display = "block"; signupTab.style.background = "var(--bg-card)"; loginTab.style.background = "transparent"; };
            
            document.getElementById("doLogin").onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); showToast("Welcome back!"); } catch(e) { showToast(e.message); } };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value, email = document.getElementById("signupEmail").value, pwd = document.getElementById("signupPassword").value, role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { name, email, role, createdAt: Timestamp.now(), verified: false, bio: "", title: "", skills: [] });
                    showToast("Account created!");
                } catch(e) { showToast(e.message); }
            };
        }

        // Feed with Pagination
        async function loadFeed() {
            const feedContainer = document.getElementById("feedContainer");
            if (!feedContainer) return;
            
            if (!lastPostDoc) {
                feedContainer.innerHTML = `<div class="skeleton" style="height:200px;"></div>`;
                isLoading = false;
            }
            
            if (isLoading) return;
            isLoading = true;
            
            let q = query(postsCol, orderBy("timestamp", "desc"), limit(10));
            if (lastPostDoc) q = query(postsCol, orderBy("timestamp", "desc"), startAfter(lastPostDoc), limit(10));
            
            const snapshot = await getDocs(q);
            lastPostDoc = snapshot.docs[snapshot.docs.length - 1];
            const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const currentHtml = feedContainer.innerHTML;
            const newHtml = posts.map(post => `
                <div class="card">
                    <div class="post-header">
                        <div class="avatar">${escapeHtml(post.authorName?.charAt(0) || 'U')}</div>
                        <div>
                            <div style="font-weight:700;">${escapeHtml(post.authorName || 'User')}</div>
                            <div style="font-size:0.7rem; color:var(--text-secondary);">${getTimeAgo(post.timestamp)}</div>
                        </div>
                    </div>
                    <div class="post-content"><p>${escapeHtml(post.content)}</p></div>
                    <div class="post-stats"><span><i class="fas fa-heart"></i> ${post.likes || 0}</span></div>
                </div>
            `).join('');
            
            feedContainer.innerHTML = (lastPostDoc ? currentHtml : '') + newHtml;
            if (snapshot.docs.length === 10 && !document.getElementById("loadMoreFeed")) {
                feedContainer.innerHTML += `<button id="loadMoreFeed" class="btn-outline" style="width:100%; margin-top:1rem;">Load More Posts</button>`;
                document.getElementById("loadMoreFeed")?.addEventListener("click", () => loadFeed());
            }
            isLoading = false;
        }

        // Jobs with Pagination & Detail Modal
        async function loadJobs() {
            const jobsContainer = document.getElementById("jobsContainer");
            if (!jobsContainer) return;
            
            if (!lastJobDoc) jobsContainer.innerHTML = `<div class="skeleton" style="height:200px;"></div>`;
            if (isLoading) return;
            isLoading = true;
            
            let q = query(jobsCol, orderBy("timestamp", "desc"), limit(10));
            if (lastJobDoc) q = query(jobsCol, orderBy("timestamp", "desc"), startAfter(lastJobDoc), limit(10));
            
            const snapshot = await getDocs(q);
            lastJobDoc = snapshot.docs[snapshot.docs.length - 1];
            const jobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const jobsHtml = jobs.map(job => `
                <div class="card">
                    <div class="job-header">
                        <div class="job-logo"><i class="fas fa-building"></i></div>
                        <div class="job-title">
                            <h3>${escapeHtml(job.title)}</h3>
                            <div class="company-name">${escapeHtml(job.employerName)} ${job.employerVerified ? '<span class="badge badge-verified"><i class="fas fa-check-circle"></i> Verified</span>' : ''}</div>
                            <div class="job-details">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</span>
                                <span><i class="fas fa-clock"></i> ${getTimeAgo(job.timestamp)}</span>
                            </div>
                        </div>
                    </div>
                    <div style="display:flex; gap:0.5rem;">
                        <button class="view-job" data-id="${job.id}" style="flex:1; background:var(--bg-primary); border:1px solid var(--border); padding:0.6rem; border-radius:0.5rem; cursor:pointer;">View Details</button>
                        <button class="apply-job" data-id="${job.id}" style="flex:1; background:var(--accent-gradient); border:none; padding:0.6rem; border-radius:0.5rem; color:white; cursor:pointer;">Apply Now</button>
                    </div>
                </div>
            `).join('');
            
            jobsContainer.innerHTML = jobsHtml;
            if (snapshot.docs.length === 10) {
                jobsContainer.innerHTML += `<button id="loadMoreJobs" class="btn-outline" style="width:100%; margin-top:1rem;">Load More Jobs</button>`;
                document.getElementById("loadMoreJobs")?.addEventListener("click", () => loadJobs());
            }
            
            // Job detail modal
            document.querySelectorAll('.view-job').forEach(btn => {
                btn.onclick = async () => {
                    const jobId = btn.dataset.id;
                    const jobDoc = await getDoc(doc(jobsCol, jobId));
                    const job = jobDoc.data();
                    const modal = document.createElement("div"); modal.className = "modal active";
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h2>${escapeHtml(job.title)}</h2>
                            <p><strong>${escapeHtml(job.employerName)}</strong> ${job.employerVerified ? '✓ Verified' : ''}</p>
                            <p>📍 ${escapeHtml(job.location)}<br/>💰 ${escapeHtml(job.salary || 'Negotiable')}<br/>📅 Posted ${getTimeAgo(job.timestamp)}</p>
                            <p><strong>Description:</strong><br/>${escapeHtml(job.description)}</p>
                            <p><strong>Contact:</strong> ${escapeHtml(job.contactInfo || 'Not provided')}</p>
                            <button class="apply-now" data-id="${job.id}" style="margin-top:1rem;">Apply Now</button>
                            <button class="close-modal" style="margin-top:0.5rem; background:#64748b;">Close</button>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    modal.querySelector(".apply-now")?.addEventListener("click", async () => { await applyForJob(jobId); modal.remove(); });
                    modal.querySelector(".close-modal")?.addEventListener("click", () => modal.remove());
                };
            });
            isLoading = false;
        }

        async function applyForJob(jobId) {
            const existing = await getDocs(query(applicationsCol, where("jobId", "==", jobId), where("applicantId", "==", currentUserId)));
            if (!existing.empty) return showToast("You already applied for this job");
            await addDoc(applicationsCol, { jobId, applicantId: currentUserId, status: 'applied', appliedAt: Timestamp.now() });
            showToast("Application submitted!");
        }

        // Network with User Search (Pagination)
        let lastUserDoc = null;
        async function loadNetwork() {
            const networkContainer = document.getElementById("networkContainer");
            if (!networkContainer) return;
            
            networkContainer.innerHTML = `
                <div class="card">
                    <input type="text" id="searchUsers" class="search-input" placeholder="Search by name or email...">
                    <div id="searchResults"></div>
                </div>
                <div class="card">
                    <h3>Connection Requests</h3>
                    <div id="connectionRequests">Loading...</div>
                </div>
            `;
            
            document.getElementById("searchUsers")?.addEventListener("input", async (e) => {
                const searchTerm = e.target.value.toLowerCase();
                if (searchTerm.length < 2) return;
                const q = query(usersCol, orderBy("name"), limit(20));
                const snapshot = await getDocs(q);
                const results = snapshot.docs.filter(d => d.id !== currentUserId && (d.data().name?.toLowerCase().includes(searchTerm) || d.data().email?.toLowerCase().includes(searchTerm)));
                document.getElementById("searchResults").innerHTML = results.map(user => `
                    <div class="connection-card" style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; border-bottom:1px solid var(--border);">
                        <div><strong>${escapeHtml(user.data().name)}</strong><br/><span style="font-size:0.7rem;">${escapeHtml(user.data().title || 'Professional')}</span></div>
                        <button class="message-user" data-id="${user.id}" data-name="${escapeHtml(user.data().name)}" class="btn-sm btn-primary-sm">Message</button>
                    </div>
                `).join('');
                
                document.querySelectorAll('.message-user').forEach(btn => {
                    btn.onclick = async () => {
                        const roomId = [currentUserId, btn.dataset.id].sort().join('_');
                        const roomRef = doc(chatRoomsCol, roomId);
                        const roomDoc = await getDoc(roomRef);
                        if (!roomDoc.exists()) await setDoc(roomRef, { participants: [currentUserId, btn.dataset.id], lastMessage: "", updatedAt: Timestamp.now() });
                        navigateTo('chat');
                        loadChatMessages(roomId);
                    };
                });
            });
        }

        // Chat with Room List
        let roomsUnsubscribe = null;
        async function loadChatRooms() {
            const chatContainer = document.getElementById("chatContainer");
            if (!chatContainer) return;
            
            chatContainer.innerHTML = `
                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                    <div style="flex:1; min-width:200px;">
                        <div class="card"><h4>Conversations</h4><div id="roomsList">Loading...</div></div>
                    </div>
                    <div style="flex:2;" id="chatArea"><p style="text-align:center; padding:2rem;">Select a conversation</p></div>
                </div>
            `;
            
            if (roomsUnsubscribe) roomsUnsubscribe();
            roomsUnsubscribe = onSnapshot(query(chatRoomsCol, where("participants", "array-contains", currentUserId)), (snapshot) => {
                const rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const roomsList = document.getElementById("roomsList");
                if (roomsList) {
                    roomsList.innerHTML = rooms.map(room => {
                        const otherId = room.participants.find(p => p !== currentUserId);
                        return `<div class="chat-room-item" data-room="${room.id}" style="padding:0.75rem; border-bottom:1px solid var(--border); cursor:pointer;">
                            <strong>User ${escapeHtml(otherId?.substring(0, 8))}</strong>
                            <div style="font-size:0.7rem; color:var(--text-secondary);">${room.lastMessage || 'No messages yet'}</div>
                        </div>`;
                    }).join('');
                    document.querySelectorAll('.chat-room-item').forEach(room => {
                        room.onclick = () => loadChatMessages(room.dataset.room);
                    });
                }
            });
        }
        
        let messagesUnsubscribe = null;
        async function loadChatMessages(roomId) {
            const chatArea = document.getElementById("chatArea");
            if (!chatArea) return;
            
            chatArea.innerHTML = `
                <div class="card" style="display:flex; flex-direction:column; height:500px;">
                    <div class="chat-messages" id="chatMessages" style="flex:1; overflow-y:auto; padding:1rem;"></div>
                    <div class="chat-input" style="display:flex; gap:0.5rem; padding:1rem; border-top:1px solid var(--border);">
                        <input type="text" id="messageInput" placeholder="Type a message..." style="flex:1; padding:0.75rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border);">
                        <button id="sendMessageBtn" style="width:auto; padding:0.75rem 1.5rem;"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            
            if (messagesUnsubscribe) messagesUnsubscribe();
            messagesUnsubscribe = onSnapshot(query(messagesCol, where("roomId", "==", roomId), orderBy("timestamp", "asc")), (snapshot) => {
                const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const messagesContainer = document.getElementById("chatMessages");
                if (messagesContainer) {
                    messagesContainer.innerHTML = messages.map(msg => `
                        <div class="message ${msg.senderId === currentUserId ? 'sent' : 'received'}" style="max-width:80%; padding:0.6rem 1rem; border-radius:1rem; margin-bottom:0.5rem; ${msg.senderId === currentUserId ? 'background:var(--accent); color:white; align-self:flex-end;' : 'background:var(--bg-primary); align-self:flex-start;'}">
                            ${escapeHtml(msg.text)}
                            <div style="font-size:0.6rem; opacity:0.7;">${getTimeAgo(msg.timestamp)}</div>
                        </div>
                    `).join('');
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            });
            
            document.getElementById("sendMessageBtn")?.addEventListener("click", async () => {
                const input = document.getElementById("messageInput");
                const text = input.value.trim();
                if (text) {
                    await addDoc(messagesCol, { roomId, senderId: currentUserId, text, timestamp: Timestamp.now(), read: false });
                    await updateDoc(doc(chatRoomsCol, roomId), { lastMessage: text, updatedAt: Timestamp.now() });
                    input.value = '';
                }
            });
        }

        // Profile
        async function loadProfile() {
            const profileContainer = document.getElementById("profileContainer");
            if (!profileContainer) return;
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            const userData = userDoc.data();
            currentUserData = userData;
            
            profileContainer.innerHTML = `
                <div class="card" style="text-align:center;">
                    <div class="avatar" style="width:80px; height:80px; margin:0 auto 1rem; font-size:2rem;">${escapeHtml(userData.name?.charAt(0) || 'U')}</div>
                    <h2>${escapeHtml(userData.name)}</h2>
                    <p style="color:var(--text-secondary);">${escapeHtml(userData.title || 'Professional')}</p>
                    <p>${escapeHtml(userData.bio || 'No bio yet')}</p>
                    <button id="editProfileBtn" class="btn-outline" style="width:100%;">Edit Profile</button>
                </div>
                <div class="card"><h3>Skills</h3><div class="skills-list">${(userData.skills || []).map(s => `<span class="badge" style="background:var(--accent);">${escapeHtml(s)}</span>`).join('')}<button id="addSkillBtn" class="badge" style="background:var(--success); cursor:pointer;">+ Add</button></div></div>
                <div class="card"><h3>Applications</h3><div id="userApplications">Loading...</div></div>
            `;
            
            const appsSnap = await getDocs(query(applicationsCol, where("applicantId", "==", currentUserId)));
            const jobsMap = new Map();
            for (const app of appsSnap.docs) {
                const jobDoc = await getDoc(doc(jobsCol, app.data().jobId));
                if (jobDoc.exists()) jobsMap.set(app.id, { status: app.data().status, job: jobDoc.data() });
            }
            document.getElementById("userApplications").innerHTML = Array.from(jobsMap.entries()).map(([id, data]) => `
                <div style="padding:0.5rem 0; border-bottom:1px solid var(--border);"><strong>${escapeHtml(data.job.title)}</strong><br/><span class="badge" style="background:var(--success);">${data.status}</span></div>
            `).join('');
            
            document.getElementById("editProfileBtn")?.addEventListener("click", () => {
                const bio = prompt("Enter your bio:", userData.bio || "");
                const title = prompt("Enter your title (e.g., Software Engineer):", userData.title || "");
                if (bio !== null) updateDoc(doc(usersCol, currentUserId), { bio, title });
            });
            document.getElementById("addSkillBtn")?.addEventListener("click", () => {
                const skill = prompt("Enter a skill:");
                if (skill) updateDoc(doc(usersCol, currentUserId), { skills: arrayUnion(skill) });
            });
        }

        // Admin Dashboard
        async function loadAdminDashboard() {
            const adminContainer = document.getElementById("adminContainer");
            if (!adminContainer) return;
            
            const usersSnap = await getDocs(query(usersCol, limit(50)));
            const jobsSnap = await getDocs(query(jobsCol, limit(50)));
            
            adminContainer.innerHTML = `
                <div class="card"><h3>📊 Platform Analytics</h3><p>Total Users: ${usersSnap.size}<br/>Total Jobs: ${jobsSnap.size}</p></div>
                <div class="card"><h3>⚠️ Pending Verifications</h3><div id="pendingVerifications"></div></div>
                <div class="card"><h3>📋 All Jobs</h3><div id="adminJobsList"></div></div>
            `;
            
            const pendingEmployers = usersSnap.docs.filter(d => d.data().role === 'Employer' && !d.data().verified);
            document.getElementById("pendingVerifications").innerHTML = pendingEmployers.map(emp => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0; border-bottom:1px solid var(--border);">
                    <span><strong>${escapeHtml(emp.data().name)}</strong><br/>${emp.data().email}</span>
                    <button class="verify-user" data-id="${emp.id}" style="background:var(--success); border:none; padding:0.3rem 0.8rem; border-radius:0.5rem; cursor:pointer;">Verify</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.verify-user').forEach(btn => {
                btn.onclick = async () => { await updateDoc(doc(usersCol, btn.dataset.id), { verified: true }); showToast("Employer verified!"); loadAdminDashboard(); };
            });
        }

        // Main App Render
        async function renderMainApp() {
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            currentUserData = userDoc.data();
            const isAdmin = currentUserData?.role === 'Admin';
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink</div>
                    <div style="display:flex; gap:0.5rem;">
                        <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--text-primary); cursor:pointer;"><i class="fas fa-moon"></i></button>
                        <button class="logout-btn" style="background:#ef4444; border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white; cursor:pointer;">Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button data-nav="feed"><i class="fas fa-home"></i><span>Feed</span></button>
                    <button data-nav="jobs"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="network"><i class="fas fa-users"></i><span>Network</span></button>
                    <button data-nav="chat"><i class="fas fa-comment"></i><span>Chat</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                    ${isAdmin ? '<button data-nav="admin"><i class="fas fa-shield-alt"></i><span>Admin</span></button>' : ''}
                </div>
                <div class="container">
                    <div id="feedView" class="view"><div id="feedContainer"></div><div class="card" style="text-align:center;"><button id="createPostBtn" class="btn-primary"><i class="fas fa-plus"></i> Create Post</button></div></div>
                    <div id="jobsView" class="view"><div id="jobsContainer"></div></div>
                    <div id="networkView" class="view"><div id="networkContainer"></div></div>
                    <div id="chatView" class="view"><div id="chatContainer"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                    ${isAdmin ? '<div id="adminView" class="view"><div id="adminContainer"></div></div>' : ''}
                </div>
            `;
            
            document.querySelectorAll('.bottom-nav button').forEach(btn => { btn.onclick = () => navigateTo(btn.dataset.nav); });
            document.querySelector(".logout-btn")?.addEventListener("click", () => signOut(auth));
            document.getElementById("createPostBtn")?.addEventListener("click", () => {
                const content = prompt("What's on your mind?", "");
                if (content) addDoc(postsCol, { content, authorId: currentUserId, authorName: currentUserData?.name, timestamp: Timestamp.now(), likes: 0 });
            });
            
            loadFeed(); loadJobs(); loadNetwork(); loadChatRooms(); loadProfile();
            if (isAdmin) loadAdminDashboard();
            navigateTo('feed');
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            renderMainApp();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user; currentUserId = user.uid;
                const userDoc = await getDoc(doc(usersCol, user.uid));
                if (!userDoc.exists()) await setDoc(doc(usersCol, user.uid), { name: user.email.split('@')[0], email: user.email, role: "Job Seeker", createdAt: Timestamp.now(), verified: false, bio: "", title: "", skills: [] });
                renderDashboard();
            } else { currentUser = null; renderAuthScreen(); }
        });
    </script>
</body>
</html>
