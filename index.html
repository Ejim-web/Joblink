<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JobLink – Professional Job Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); min-height: 100vh; }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
        .auth-card { background: rgba(255,255,255,0.96); border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25); width: 100%; max-width: 460px; padding: 2rem 1.8rem; text-align: center; }
        .logo-icon { font-size: 3.2rem; background: linear-gradient(145deg, #0f172a, #1e293b); padding: 0.6rem 1rem; border-radius: 3rem; display: inline-block; }
        .logo-large h2 { font-size: 1.9rem; margin-top: 0.75rem; color: #0f172a; }
        .auth-tabs { display: flex; gap: 1rem; background: #f1f5f9; border-radius: 3rem; padding: 0.3rem; margin-bottom: 2rem; }
        .tab-btn { flex: 1; background: transparent; border: none; padding: 0.7rem; font-weight: 600; border-radius: 2.5rem; cursor: pointer; }
        .tab-btn.active { background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 0.9rem 1rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; margin-bottom: 1rem; }
        button { background: #0f172a; color: white; border: none; padding: 0.9rem; border-radius: 2rem; font-weight: 600; cursor: pointer; width: 100%; }
        .navbar { background: white; padding: 0.8rem 2rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid #eef2ff; }
        .logo { font-weight: 700; font-size: 1.5rem; }
        .nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .nav-btn, .logout-btn { width: auto; padding: 0.5rem 1.2rem; background: #f1f5f9; color: #1e293b; }
        .logout-btn { background: #ef4444; color: white; }
        .dashboard-content { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }
        .view { display: none; }
        .view.active { display: block; }
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .job-card { background: white; border-radius: 1.5rem; padding: 1.3rem; border: 1px solid #eef2ff; }
        .boost-badge { background: #f59e0b; padding: 0.2rem 0.7rem; border-radius: 2rem; font-size: 0.7rem; font-weight: bold; }
        .job-actions, .employer-actions { margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .job-actions button, .employer-actions button { width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; }
        .save-btn.saved { background: #ec489a; }
        .search-bar input { border-radius: 3rem; background: white; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 500px; width: 90%; border-radius: 2rem; padding: 1.6rem; }
        .empty-state { text-align: center; padding: 3rem; color: #475569; }
        .toast-notification { position: fixed; bottom: 20px; left: 20px; background: #1e293b; color: white; padding: 0.8rem 1.5rem; border-radius: 3rem; z-index: 2000; }
        @media (max-width: 640px) { .navbar { flex-direction: column; } .nav-links { justify-content: center; } }
    </style>
    <!-- Error logger -->
    <script>
        window.onerror = function(msg, src, line, col, err) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed; bottom:10px; left:10px; background:red; color:white; padding:10px; border-radius:8px; z-index:9999; font-size:12px; max-width:90%;';
            errDiv.innerHTML = `⚠️ ERROR: ${msg} at line ${line}`;
            document.body.appendChild(errDiv);
            console.error(msg, src, line);
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, Timestamp, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // FIXED storage bucket URL
        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",  // ← fixed
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const applicationsCol = collection(db, "applications");
        const savedJobsCol = collection(db, "savedJobs");

        let currentUser = null, userRole = null, currentUserId = null;
        let notificationsUnsubscribe = null;
        let jobSeekerClickHandler = null, employerClickHandler = null;
        let currentSavedJobsSet = new Set();
        let allJobsCache = [];

        function showToast(msg, type = "info") {
            const toast = document.createElement("div");
            toast.className = `toast-notification ${type}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m)); }
        function isBoostActive(job) {
            if (!job.boosted) return false;
            const expiry = job.boostExpiry?.toDate ? job.boostExpiry.toDate() : new Date(job.boostExpiry);
            return expiry > new Date();
        }

        // ----- AUTH UI -----
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="logo-large"><div class="logo-icon">💼🔗</div><h2>JobLink</h2><p>Connect · Hire · Grow</p></div>
                        <div class="auth-tabs"><button class="tab-btn active" data-tab="login">Sign in</button><button class="tab-btn" data-tab="signup">Create account</button></div>
                        <div id="loginPanel"><input type="email" id="loginEmail" placeholder="Email" /><input type="password" id="loginPassword" placeholder="Password" /><button id="doLogin">Sign in →</button></div>
                        <div id="signupPanel" style="display:none;"><input type="text" id="signupName" placeholder="Full name" /><input type="email" id="signupEmail" placeholder="Email" /><input type="password" id="signupPassword" placeholder="Password" /><select id="signupRole"><option>Job Seeker</option><option>Employer</option><option>Admin</option></select><button id="doSignup">Get started →</button></div>
                    </div>
                </div>
            `;
            const loginPanel = document.getElementById("loginPanel"), signupPanel = document.getElementById("signupPanel");
            const loginTab = document.querySelector('[data-tab="login"]'), signupTab = document.querySelector('[data-tab="signup"]');
            loginTab.onclick = () => { loginPanel.style.display = "block"; signupPanel.style.display = "none"; loginTab.classList.add("active"); signupTab.classList.remove("active"); };
            signupTab.onclick = () => { loginPanel.style.display = "none"; signupPanel.style.display = "block"; signupTab.classList.add("active"); loginTab.classList.remove("active"); };
            document.getElementById("doLogin").onclick = async () => {
                const email = document.getElementById("loginEmail").value, pwd = document.getElementById("loginPassword").value;
                try { await signInWithEmailAndPassword(auth, email, pwd); showToast("Welcome back!", "success"); } catch(err) { showToast(err.message, "error"); }
            };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value, email = document.getElementById("signupEmail").value, pwd = document.getElementById("signupPassword").value, role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required", "error");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { name, email, role, createdAt: Timestamp.now() });
                    showToast("Account created!", "success");
                } catch(err) { showToast(err.message, "error"); }
            };
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            if (userRole === "Job Seeker") renderJobSeekerDashboard();
            else if (userRole === "Employer") renderEmployerDashboard();
            else if (userRole === "Admin") renderAdminDashboard();
            else renderAuthScreen();
        }

        // ----- JOB SEEKER (with manual sort, no index needed) -----
        async function fetchSavedJobsSet() {
            const q = query(savedJobsCol, where("userId", "==", currentUserId));
            const snap = await getDocs(q);
            currentSavedJobsSet.clear();
            snap.forEach(d => currentSavedJobsSet.add(d.data().jobId));
        }
        async function toggleSaveJob(jobId) {
            const ref = doc(savedJobsCol, `${currentUserId}_${jobId}`);
            if (currentSavedJobsSet.has(jobId)) { await deleteDoc(ref); currentSavedJobsSet.delete(jobId); showToast("Removed"); }
            else { await setDoc(ref, { userId: currentUserId, jobId, savedAt: Timestamp.now() }); currentSavedJobsSet.add(jobId); showToast("Saved"); }
            renderJobSeekerDashboard();
        }
        function sortJobsByBoostAndDate(jobs) {
            return [...jobs].sort((a,b) => {
                const boostA = isBoostActive(a), boostB = isBoostActive(b);
                if (boostA && !boostB) return -1;
                if (!boostA && boostB) return 1;
                return (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0);
            });
        }
        function renderJobCards(jobs, search = "") {
            const filtered = jobs.filter(j => !search || [j.title, j.category, j.location].some(f => f?.toLowerCase().includes(search.toLowerCase())));
            const sorted = sortJobsByBoostAndDate(filtered);
            if (!sorted.length) return "<div class='empty-state'>No jobs found</div>";
            return sorted.map(job => `
                <div class="job-card">
                    <div style="display:flex; justify-content:space-between;"><h3>${escapeHtml(job.title)}</h3>${isBoostActive(job) ? '<span class="boost-badge">⚡ BOOSTED</span>' : ''}</div>
                    <p style="color:#2563eb;">🏢 ${escapeHtml(job.employerName)}</p>
                    <p>📍 ${escapeHtml(job.location)} | 💰 ${escapeHtml(job.salary || "Negotiable")}</p>
                    <span class="category-tag" style="background:#eef2ff; padding:4px 12px; border-radius:30px;">${escapeHtml(job.category)}</span>
                    <div class="job-actions">
                        <button class="details-btn" data-id="${job.id}">Details</button>
                        <button class="apply-btn" data-id="${job.id}">Apply</button>
                        <button class="save-btn ${currentSavedJobsSet.has(job.id) ? 'saved' : ''}" data-id="${job.id}">${currentSavedJobsSet.has(job.id) ? "❤️ Saved" : "🤍 Save"}</button>
                    </div>
                </div>
            `).join("");
        }
        async function loadSavedJobsList() {
            const container = document.getElementById("savedJobsList");
            if (!container) return;
            const savedSnap = await getDocs(query(savedJobsCol, where("userId", "==", currentUserId)));
            const ids = savedSnap.docs.map(d => d.data().jobId);
            if (!ids.length) { container.innerHTML = "<div class='empty-state'>No bookmarks</div>"; return; }
            const jobsSnap = await getDocs(jobsCol);
            const saved = []; jobsSnap.forEach(d => { if(ids.includes(d.id)) saved.push({ id: d.id, ...d.data() }); });
            container.innerHTML = renderJobCards(saved);
        }
        function showJobModal(job) {
            const modal = document.createElement("div"); modal.className = "modal";
            modal.innerHTML = `<div class="modal-content"><h2>${escapeHtml(job.title)}</h2><p><strong>${escapeHtml(job.employerName)}</strong><br/>📍 ${job.location}<br/>💰 ${job.salary}<br/>📂 ${job.category}<br/>📞 ${job.contactInfo || "N/A"}</p><p>${escapeHtml(job.description)}</p><button class="close-modal">Close</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector(".close-modal").onclick = () => modal.remove();
        }
        function showApplyModal(job) {
            const modal = document.createElement("div"); modal.className = "modal";
            modal.innerHTML = `<div class="modal-content"><h3>Apply to ${escapeHtml(job.title)}</h3><input id="appName" placeholder="Name" value="${escapeHtml(currentUser.displayName || currentUser.email)}" /><input id="appEmail" placeholder="Email" value="${currentUser.email}" /><textarea id="appMsg" placeholder="Why you're a good fit..."></textarea><button id="submitApp">Submit</button><button class="close-modal">Cancel</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector("#submitApp").onclick = async () => {
                await addDoc(applicationsCol, { jobId: job.id, applicantId: currentUserId, name: modal.querySelector("#appName").value, email: modal.querySelector("#appEmail").value, message: modal.querySelector("#appMsg").value, timestamp: Timestamp.now() });
                showToast("Application sent!"); modal.remove();
            };
            modal.querySelector(".close-modal").onclick = () => modal.remove();
        }
        async function renderJobSeekerDashboard() {
            await fetchSavedJobsSet();
            const jobsSnap = await getDocs(jobsCol);
            let jobs = []; jobsSnap.forEach(d => jobs.push({ id: d.id, ...d.data() }));
            allJobsCache = jobs;
            document.getElementById("app").innerHTML = `
                <nav class="navbar"><div class="logo">💼🔗 JobLink</div><div class="nav-links"><button class="nav-btn active" data-nav="home">Home</button><button class="nav-btn" data-nav="jobs">Jobs</button><button class="nav-btn" data-nav="profile">Profile</button><button class="logout-btn">Logout</button></div></nav>
                <div class="dashboard-content">
                    <div id="homeView" class="view active"><h2>🔥 Latest jobs</h2><div class="search-bar"><input type="text" id="searchJobs" placeholder="Search..." /></div><div id="jobsContainer" class="jobs-grid">${renderJobCards(jobs)}</div></div>
                    <div id="jobsView" class="view"><h2>📌 All jobs</h2><div class="search-bar"><input type="text" id="jobsSearch" placeholder="Search..." /></div><div id="allJobsContainer" class="jobs-grid">${renderJobCards(jobs)}</div></div>
                    <div id="profileView" class="view"><h2>My profile</h2><p><strong>${escapeHtml(currentUser.displayName)}</strong><br/>${currentUser.email}<br/>Role: Job Seeker</p><hr/><h3>📖 Bookmarks</h3><div id="savedJobsList" class="jobs-grid"></div></div>
                </div>
            `;
            document.querySelectorAll(".nav-btn").forEach(btn => btn.onclick = () => { document.querySelectorAll(".view").forEach(v => v.classList.remove("active")); document.getElementById(btn.dataset.nav+"View").classList.add("active"); if(btn.dataset.nav === "profile") loadSavedJobsList(); });
            document.querySelector(".logout-btn").onclick = () => signOut(auth);
            document.getElementById("searchJobs")?.addEventListener("input", e => document.getElementById("jobsContainer").innerHTML = renderJobCards(allJobsCache, e.target.value));
            document.getElementById("jobsSearch")?.addEventListener("input", e => document.getElementById("allJobsContainer").innerHTML = renderJobCards(allJobsCache, e.target.value));
            if (jobSeekerClickHandler) document.removeEventListener("click", jobSeekerClickHandler);
            jobSeekerClickHandler = async (e) => {
                const details = e.target.closest(".details-btn"), apply = e.target.closest(".apply-btn"), save = e.target.closest(".save-btn");
                if (details) { const job = allJobsCache.find(j => j.id === details.dataset.id); if(job) showJobModal(job); }
                else if (apply) { const job = allJobsCache.find(j => j.id === apply.dataset.id); if(job) showApplyModal(job); }
                else if (save) await toggleSaveJob(save.dataset.id);
            };
            document.addEventListener("click", jobSeekerClickHandler);
            await loadSavedJobsList();
        }

        // ----- EMPLOYER (fixed index issue: removed orderBy, sort manually) -----
        async function renderEmployerDashboard() {
            const jobsSnap = await getDocs(query(jobsCol, where("employerId", "==", currentUserId)));
            let jobs = []; jobsSnap.forEach(d => jobs.push({ id: d.id, ...d.data() }));
            // manual sort
            jobs.sort((a,b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
            document.getElementById("app").innerHTML = `
                <nav class="navbar"><div class="logo">💼🔗 JobLink (Employer)</div><div class="nav-links"><button class="nav-btn active" data-nav="myjobs">My Jobs</button><button class="nav-btn" data-nav="postjob">Post Job</button><button class="nav-btn" data-nav="profile">Profile</button><button class="logout-btn">Logout</button></div></nav>
                <div class="dashboard-content">
                    <div id="myjobsView" class="view active"><h2>Your jobs</h2><div id="empJobsGrid" class="jobs-grid">${renderEmpJobCards(jobs)}</div></div>
                    <div id="postjobView" class="view"><h2>Post a job</h2><form id="postJobForm"><input id="title" placeholder="Title" required/><textarea id="desc" placeholder="Description" required></textarea><input id="salary" placeholder="Salary"/><input id="location" placeholder="Location" required/><input id="category" placeholder="Category" required/><input id="contact" placeholder="Contact" required/><button type="submit">Post Job</button></form></div>
                    <div id="profileView" class="view"><h2>Profile</h2><p>${escapeHtml(currentUser.displayName)}<br/>${currentUser.email}</p></div>
                </div>
            `;
            document.querySelectorAll(".nav-btn").forEach(btn => btn.onclick = () => { document.querySelectorAll(".view").forEach(v => v.classList.remove("active")); document.getElementById(btn.dataset.nav+"View").classList.add("active"); if(btn.dataset.nav === "myjobs") renderEmployerDashboard(); });
            document.querySelector(".logout-btn").onclick = () => signOut(auth);
            document.getElementById("postJobForm")?.addEventListener("submit", async (e) => {
                e.preventDefault();
                await addDoc(jobsCol, { title: document.getElementById("title").value, description: document.getElementById("desc").value, salary: document.getElementById("salary").value, location: document.getElementById("location").value, category: document.getElementById("category").value, contactInfo: document.getElementById("contact").value, employerId: currentUserId, employerName: currentUser.displayName || currentUser.email, timestamp: Timestamp.now(), boosted: false, boostExpiry: null });
                showToast("Job posted!"); renderEmployerDashboard();
            });
            if (employerClickHandler) document.removeEventListener("click", employerClickHandler);
            employerClickHandler = async (e) => {
                const t = e.target;
                if (t.classList.contains("view-app")) { const jobId = t.dataset.id; const apps = await getDocs(query(applicationsCol, where("jobId", "==", jobId))); let html = "<ul>"; apps.forEach(d => { const a = d.data(); html += `<li><b>${escapeHtml(a.name)}</b> (${a.email}): ${escapeHtml(a.message)}</li>`; }); html += "</ul>"; showModal("Applicants", html); }
                else if (t.classList.contains("edit-job")) { const job = jobs.find(j => j.id === t.dataset.id); showEditModal(t.dataset.id, job); }
                else if (t.classList.contains("del-job")) { if(confirm("Delete?")) await deleteDoc(doc(jobsCol, t.dataset.id)); renderEmployerDashboard(); }
                else if (t.classList.contains("boost-job")) { const expiry = Timestamp.fromDate(new Date(Date.now() + 30*86400000)); await updateDoc(doc(jobsCol, t.dataset.id), { boosted: true, boostExpiry: expiry }); showToast("Boosted!"); renderEmployerDashboard(); }
            };
            document.addEventListener("click", employerClickHandler);
        }
        function renderEmpJobCards(jobs) {
            if (!jobs.length) return "<div class='empty-state'>No jobs posted yet</div>";
            return jobs.map(job => `<div class="job-card"><h3>${escapeHtml(job.title)}</h3><p>${job.location} | ${job.salary || "N/A"}</p><span class="category-tag">${job.category}</span>${isBoostActive(job) ? '<span class="boost-badge"> Boosted</span>' : ''}<div class="employer-actions"><button class="view-app" data-id="${job.id}">Applicants</button><button class="edit-job" data-id="${job.id}">Edit</button><button class="del-job" data-id="${job.id}">Delete</button>${!isBoostActive(job) ? `<button class="boost-job" data-id="${job.id}">⚡ Boost</button>` : ''}</div></div>`).join("");
        }
        async function showEditModal(jobId, jobData) {
            const modal = document.createElement("div"); modal.className = "modal";
            modal.innerHTML = `<div class="modal-content"><h3>Edit job</h3><input id="editTitle" value="${escapeHtml(jobData.title)}"/><textarea id="editDesc">${escapeHtml(jobData.description)}</textarea><input id="editSalary" value="${escapeHtml(jobData.salary||'')}"/><input id="editLocation" value="${escapeHtml(jobData.location)}"/><input id="editCategory" value="${escapeHtml(jobData.category)}"/><input id="editContact" value="${escapeHtml(jobData.contactInfo||'')}"/><button id="saveEdit">Save</button><button class="close-modal">Cancel</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector("#saveEdit").onclick = async () => {
                await updateDoc(doc(jobsCol, jobId), { title: modal.querySelector("#editTitle").value, description: modal.querySelector("#editDesc").value, salary: modal.querySelector("#editSalary").value, location: modal.querySelector("#editLocation").value, category: modal.querySelector("#editCategory").value, contactInfo: modal.querySelector("#editContact").value });
                showToast("Updated"); modal.remove(); renderEmployerDashboard();
            };
            modal.querySelector(".close-modal").onclick = () => modal.remove();
        }

        // ----- ADMIN -----
        async function renderAdminDashboard() {
            const users = (await getDocs(usersCol)).docs.map(d => ({ id: d.id, ...d.data() }));
            const jobs = (await getDocs(jobsCol)).docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById("app").innerHTML = `<nav class="navbar"><div class="logo">🛡️ JobLink Admin</div><button class="logout-btn">Logout</button></nav><div class="admin-panel" style="background:white; margin:2rem; border-radius:2rem; padding:2rem;"><h2>Users</h2>${users.map(u => `<div>${u.email} (${u.role}) <button class="del-user" data-id="${u.id}">Delete</button></div>`).join('')}<h2>Jobs</h2>${jobs.map(j => `<div>${j.title} – ${j.employerName} <button class="del-job" data-id="${j.id}">Delete</button></div>`).join('')}</div>`;
            document.querySelector(".logout-btn").onclick = () => signOut(auth);
            document.querySelectorAll(".del-user").forEach(btn => btn.onclick = async () => { if(confirm("Delete user?")) await deleteDoc(doc(usersCol, btn.dataset.id)); renderAdminDashboard(); });
            document.querySelectorAll(".del-job").forEach(btn => btn.onclick = async () => { if(confirm("Delete job?")) await deleteDoc(doc(jobsCol, btn.dataset.id)); renderAdminDashboard(); });
        }
        function showModal(title, content) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="modal-content"><h3>${title}</h3>${content}<button class="close-modal">Close</button></div>`; document.body.appendChild(m); m.querySelector(".close-modal").onclick = () => m.remove(); }

        // ----- AUTH STATE LISTENER -----
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserId = user.uid;
                try {
                    const userDoc = await getDoc(doc(usersCol, user.uid));
                    if (userDoc.exists()) {
                        userRole = userDoc.data().role;
                        currentUser.displayName = userDoc.data().name || user.email;
                    } else {
                        await setDoc(doc(usersCol, user.uid), { name: user.email.split('@')[0], email: user.email, role: "Job Seeker", createdAt: Timestamp.now() });
                        userRole = "Job Seeker";
                        currentUser.displayName = user.email.split('@')[0];
                    }
                } catch(e) { console.error(e); userRole = "Job Seeker"; }
                if (userRole === "Job Seeker") {
                    if (notificationsUnsubscribe) notificationsUnsubscribe();
                    notificationsUnsubscribe = onSnapshot(jobsCol, (snap) => {
                        snap.docChanges().forEach(change => {
                            if (change.type === "added" && change.doc.data().timestamp?.toMillis() > Date.now() - 5000)
                                showToast(`📢 New: ${change.doc.data().title}`);
                        });
                    });
                }
                renderDashboard();
            } else {
                if (notificationsUnsubscribe) notificationsUnsubscribe();
                if (jobSeekerClickHandler) document.removeEventListener("click", jobSeekerClickHandler);
                if (employerClickHandler) document.removeEventListener("click", employerClickHandler);
                currentUser = null; userRole = null;
                renderAuthScreen();
            }
        });
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
