<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="JobLink - Africa's most beautiful professional network. Find jobs, connect with employers, grow your career.">
    <title>JobLink – Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Premium Dark Theme */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-card: linear-gradient(145deg, #1a1a24, #14141c);
            --bg-card-solid: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7a;
            --border: rgba(255,255,255,0.06);
            --accent: #3b82f6;
            --accent-2: #6366f1;
            --accent-3: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1, #8b5cf6);
            --accent-gradient-hover: linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 30px rgba(59,130,246,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Light Theme */
        body.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: linear-gradient(145deg, #ffffff, #f8fafc);
            --bg-card-solid: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: rgba(0,0,0,0.05);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            padding-bottom: 70px;
        }
        
        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(var(--bg-card-solid), 0.8);
            backdrop-filter: blur(12px);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo i {
            background: none;
            color: var(--accent);
            -webkit-background-clip: unset;
        }
        
        /* Premium Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background: var(--bg-card-solid);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            border-radius: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            z-index: 100;
        }
        
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 1.5rem;
            transition: var(--transition);
        }
        
        .bottom-nav button i { font-size: 20px; }
        
        .bottom-nav button.active { 
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--shadow-glow);
        }
        
        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: 80px;
        }
        
        /* Premium Cards */
        .card {
            background: var(--bg-card-solid);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: var(--transition);
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        /* Avatar */
        .avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .avatar:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-glow);
        }
        
        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .badge-verified {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .badge-featured {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #0c0a2a;
        }
        
        .badge-remote {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
        }
        
        .badge-urgent {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        /* Buttons */
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        /* Post Styles */
        .post-header {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .post-content {
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .post-stats {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .post-actions {
            display: flex;
            gap: 1rem;
            padding-top: 0.75rem;
        }
        
        .post-actions button {
            flex: 1;
            background: none;
            border: none;
            padding: 0.5rem;
            border-radius: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
        }
        
        .post-actions button:hover {
            background: var(--bg-secondary);
            color: var(--accent);
        }
        
        .post-actions button.liked {
            color: var(--danger);
        }
        
        /* Job Card Styles */
        .job-card {
            background: var(--bg-card-solid);
            border-radius: 1.25rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        
        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .job-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .job-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, var(--accent), var(--accent-2));
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .job-title h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .company-name {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        
        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background: var(--bg-card-solid);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg-secondary) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 1rem;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: slideUp 0.4s ease forwards;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gradient);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            z-index: 2000;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }
        
        /* Search Input */
        .search-input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        
        /* Chat Styles */
        .chat-room-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .chat-room-item:hover {
            background: var(--bg-secondary);
        }
        
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1.25rem;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.3s ease;
        }
        
        .message.sent {
            background: var(--accent-gradient);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        
        .message.received {
            background: var(--bg-secondary);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0.75rem;
                padding-bottom: 80px;
            }
            
            .bottom-nav {
                width: calc(100% - 24px);
                padding: 6px 12px;
            }
            
            .bottom-nav button {
                padding: 6px 12px;
            }
        }
        
        @media (max-width: 480px) {
            .job-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .job-logo {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, Timestamp, addDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const postsCol = collection(db, "posts");
        const applicationsCol = collection(db, "applications");
        const likesCol = collection(db, "likes");

        let currentUser = null, currentUserId = null;
        let currentUserData = null;
        let feedUnsubscribe = null;

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            const diff = Math.floor((Date.now() - date) / 1000 / 60);
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${diff}m ago`;
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
            return `${Math.floor(diff / 1440)}d ago`;
        }

        // Theme
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') document.body.classList.add('light');
        }
        window.toggleTheme = () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        };
        initTheme();

        function navigateTo(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const targetView = document.getElementById(`${view}View`);
            if (targetView) targetView.classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                if (btn.dataset.nav === view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            
            if (view === 'feed') loadFeed();
            if (view === 'jobs') loadJobs();
            if (view === 'profile') loadProfile();
        }

        // Auth Screen
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem; background:var(--bg-primary);">
                    <div style="background:var(--bg-card-solid); border-radius:2rem; max-width:460px; width:100%; padding:2rem; border:1px solid var(--border); animation:slideUp 0.5s ease;">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="font-size:3rem; background:var(--accent-gradient); width:80px; height:80px; display:inline-flex; align-items:center; justify-content:center; border-radius:1.5rem; margin-bottom:1rem; box-shadow:var(--shadow-glow);">
                                <i class="fas fa-briefcase" style="color:white; font-size:2rem;"></i>
                            </div>
                            <h1 style="font-size:2rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">JobLink</h1>
                            <p style="color:var(--text-secondary); margin-top:0.25rem;">Africa's Professional Network</p>
                        </div>
                        <div style="display:flex; gap:0.75rem; background:var(--bg-secondary); border-radius:1rem; padding:0.25rem; margin-bottom:2rem;">
                            <button class="tab-btn active" data-tab="login" style="flex:1; background:var(--bg-card-solid); border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Sign In</button>
                            <button class="tab-btn" data-tab="signup" style="flex:1; background:transparent; border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Create Account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" class="search-input" placeholder="Email" style="margin-bottom:1rem;">
                            <input type="password" id="loginPassword" class="search-input" placeholder="Password" style="margin-bottom:1.5rem;">
                            <button id="doLogin" class="btn-primary">Sign In →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" class="search-input" placeholder="Full name" style="margin-bottom:1rem;">
                            <input type="email" id="signupEmail" class="search-input" placeholder="Email" style="margin-bottom:1rem;">
                            <input type="password" id="signupPassword" class="search-input" placeholder="Password" style="margin-bottom:1rem;">
                            <select id="signupRole" class="search-input" style="margin-bottom:1.5rem;">
                                <option>Job Seeker</option><option>Employer</option>
                            </select>
                            <button id="doSignup" class="btn-primary">Create Account →</button>
                        </div>
                    </div>
                </div>
            `;
            
            const loginPanel = document.getElementById("loginPanel"), signupPanel = document.getElementById("signupPanel");
            const loginTab = document.querySelector('[data-tab="login"]'), signupTab = document.querySelector('[data-tab="signup"]');
            loginTab.onclick = () => { loginPanel.style.display = "block"; signupPanel.style.display = "none"; loginTab.style.background = "var(--bg-card-solid)"; signupTab.style.background = "transparent"; };
            signupTab.onclick = () => { loginPanel.style.display = "none"; signupPanel.style.display = "block"; signupTab.style.background = "var(--bg-card-solid)"; loginTab.style.background = "transparent"; };
            
            document.getElementById("doLogin").onclick = async () => {
                try {
                    await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
                    showToast("Welcome back! 👋");
                } catch(e) { showToast(e.message); }
            };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value, email = document.getElementById("signupEmail").value, pwd = document.getElementById("signupPassword").value, role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { name, email, role, createdAt: Timestamp.now(), verified: false, bio: "", title: "", skills: [] });
                    showToast("Account created! 🎉");
                } catch(e) { showToast(e.message); }
            };
        }

        // Load Feed
        async function loadFeed() {
            const feedContainer = document.getElementById("feedContainer");
            if (!feedContainer) return;
            
            feedContainer.innerHTML = `<div class="skeleton" style="height:200px; margin-bottom:1rem;"></div><div class="skeleton" style="height:180px;"></div>`;
            
            if (feedUnsubscribe) feedUnsubscribe();
            feedUnsubscribe = onSnapshot(query(postsCol, orderBy("timestamp", "desc"), limit(20)), async (snapshot) => {
                const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const userLikes = new Set();
                const likesSnap = await getDocs(query(likesCol, where("userId", "==", currentUserId)));
                likesSnap.forEach(d => userLikes.add(d.data().postId));
                
                feedContainer.innerHTML = posts.map((post, index) => `
                    <div class="card animate-in" style="animation-delay: ${index * 0.05}s">
                        <div class="post-header">
                            <div class="avatar">${escapeHtml(post.authorName?.charAt(0) || 'U')}</div>
                            <div>
                                <div style="font-weight:700;">${escapeHtml(post.authorName || 'User')}</div>
                                <div style="font-size:0.7rem; color:var(--text-muted);">${getTimeAgo(post.timestamp)}</div>
                            </div>
                        </div>
                        <div class="post-content">
                            <p>${escapeHtml(post.content)}</p>
                        </div>
                        <div class="post-stats">
                            <span><i class="fas fa-heart" style="color:var(--danger);"></i> ${post.likes || 0}</span>
                            <span><i class="fas fa-comment"></i> ${post.comments || 0}</span>
                        </div>
                        <div class="post-actions">
                            <button class="like-post ${userLikes.has(post.id) ? 'liked' : ''}" data-id="${post.id}">
                                <i class="fas fa-heart"></i> ${userLikes.has(post.id) ? 'Liked' : 'Like'}
                            </button>
                            <button><i class="far fa-comment"></i> Comment</button>
                            <button><i class="fas fa-share"></i> Share</button>
                        </div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.like-post').forEach(btn => {
                    btn.onclick = async () => {
                        const postId = btn.dataset.id;
                        const existing = await getDocs(query(likesCol, where("postId", "==", postId), where("userId", "==", currentUserId)));
                        if (existing.empty) {
                            await addDoc(likesCol, { postId, userId: currentUserId, createdAt: Timestamp.now() });
                            await updateDoc(doc(postsCol, postId), { likes: increment(1) });
                            showToast("Post liked! ❤️");
                        } else {
                            await deleteDoc(existing.docs[0].ref);
                            await updateDoc(doc(postsCol, postId), { likes: increment(-1) });
                        }
                        loadFeed();
                    };
                });
            });
        }

        // Load Jobs
        async function loadJobs() {
            const jobsContainer = document.getElementById("jobsContainer");
            if (!jobsContainer) return;
            
            jobsContainer.innerHTML = `<div class="skeleton" style="height:180px; margin-bottom:1rem;"></div><div class="skeleton" style="height:180px;"></div>`;
            
            const jobsSnap = await getDocs(query(jobsCol, orderBy("timestamp", "desc"), limit(20)));
            const jobs = jobsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            jobsContainer.innerHTML = jobs.map(job => `
                <div class="job-card animate-in">
                    <div class="job-header">
                        <div class="job-logo"><i class="fas fa-building"></i></div>
                        <div class="job-title">
                            <h3>${escapeHtml(job.title)}</h3>
                            <div class="company-name">
                                ${escapeHtml(job.employerName)}
                                ${job.verified ? '<span class="badge badge-verified" style="margin-left:0.5rem;"><i class="fas fa-check-circle"></i> Verified</span>' : ''}
                            </div>
                            <div class="job-details">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</span>
                                <span><i class="fas fa-clock"></i> ${getTimeAgo(job.timestamp)}</span>
                            </div>
                            <div>
                                ${job.featured ? '<span class="badge badge-featured"><i class="fas fa-star"></i> Featured</span>' : ''}
                                ${job.location?.toLowerCase().includes('remote') ? '<span class="badge badge-remote"><i class="fas fa-globe"></i> Remote</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div style="display:flex; gap:0.75rem; margin-top:1rem;">
                        <button class="view-job" data-id="${job.id}" style="flex:1; background:var(--bg-secondary); border:1px solid var(--border); padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:500;">View Details</button>
                        <button class="apply-job" data-id="${job.id}" style="flex:1; background:var(--accent-gradient); border:none; padding:0.7rem; border-radius:0.75rem; color:white; cursor:pointer; font-weight:600;">Apply Now</button>
                    </div>
                </div>
            `).join('');
            
            // Job detail modal
            document.querySelectorAll('.view-job').forEach(btn => {
                btn.onclick = async () => {
                    const jobId = btn.dataset.id;
                    const jobDoc = await getDoc(doc(jobsCol, jobId));
                    const job = jobDoc.data();
                    const modal = document.createElement("div");
                    modal.className = "modal active";
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h2 style="font-size:1.5rem; margin-bottom:0.5rem;">${escapeHtml(job.title)}</h2>
                            <p style="color:var(--accent); font-weight:600; margin-bottom:1rem;">${escapeHtml(job.employerName)} ${job.verified ? '✓ Verified' : ''}</p>
                            <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border);">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</span>
                                <span><i class="fas fa-clock"></i> Posted ${getTimeAgo(job.timestamp)}</span>
                            </div>
                            <p style="margin-bottom:1rem; line-height:1.6;"><strong>Description</strong><br/>${escapeHtml(job.description)}</p>
                            <p style="margin-bottom:1.5rem;"><strong>Contact</strong><br/>${escapeHtml(job.contactInfo || 'Not provided')}</p>
                            <button class="apply-now" data-id="${job.id}" class="btn-primary" style="background:var(--accent-gradient); width:100%; padding:0.875rem; border-radius:0.75rem; border:none; color:white; font-weight:600; cursor:pointer;">Apply Now</button>
                            <button class="close-modal" style="margin-top:0.75rem; background:transparent; border:1px solid var(--border); width:100%; padding:0.875rem; border-radius:0.75rem; cursor:pointer;">Close</button>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    modal.querySelector(".apply-now")?.addEventListener("click", async () => { await applyForJob(jobId); modal.remove(); });
                    modal.querySelector(".close-modal")?.addEventListener("click", () => modal.remove());
                };
            });
            
            document.querySelectorAll('.apply-job').forEach(btn => {
                btn.onclick = async () => await applyForJob(btn.dataset.id);
            });
        }

        async function applyForJob(jobId) {
            const existing = await getDocs(query(applicationsCol, where("jobId", "==", jobId), where("applicantId", "==", currentUserId)));
            if (!existing.empty) return showToast("You already applied for this job");
            await addDoc(applicationsCol, { jobId, applicantId: currentUserId, status: 'applied', appliedAt: Timestamp.now() });
            showToast("Application submitted successfully! 🎉");
        }

        // Load Profile
        async function loadProfile() {
            const profileContainer = document.getElementById("profileContainer");
            if (!profileContainer) return;
            
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            const userData = userDoc.data();
            currentUserData = userData;
            
            const appsSnap = await getDocs(query(applicationsCol, where("applicantId", "==", currentUserId)));
            const applications = [];
            for (const app of appsSnap.docs) {
                const jobDoc = await getDoc(doc(jobsCol, app.data().jobId));
                if (jobDoc.exists()) applications.push({ id: app.id, ...app.data(), job: jobDoc.data() });
            }
            
            profileContainer.innerHTML = `
                <div class="card" style="text-align:center;">
                    <div class="avatar" style="width:100px; height:100px; margin:0 auto 1rem; font-size:2.5rem;">${escapeHtml(userData.name?.charAt(0) || 'U')}</div>
                    <h2 style="font-size:1.5rem;">${escapeHtml(userData.name)}</h2>
                    <p style="color:var(--text-secondary); margin-bottom:0.5rem;">${escapeHtml(userData.title || 'Professional')}</p>
                    <p style="margin-bottom:1rem;">${escapeHtml(userData.bio || 'No bio yet. Click edit to add your professional summary.')}</p>
                    <button id="editProfileBtn" class="btn-outline" style="width:100%;">✎ Edit Profile</button>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:0.75rem;"><i class="fas fa-code"></i> Skills</h3>
                    <div class="skills-list" style="display:flex; flex-wrap:wrap; gap:0.5rem;">
                        ${(userData.skills || ['Add your skills']).map(s => `<span class="badge" style="background:var(--accent-gradient);">${escapeHtml(s)}</span>`).join('')}
                        <button id="addSkillBtn" class="badge" style="background:var(--success); cursor:pointer;">+ Add Skill</button>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:0.75rem;"><i class="fas fa-briefcase"></i> My Applications</h3>
                    ${applications.length > 0 ? applications.map(app => `
                        <div style="padding:0.75rem 0; border-bottom:1px solid var(--border);">
                            <div style="font-weight:600;">${escapeHtml(app.job.title)}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">${escapeHtml(app.job.employerName)}</div>
                            <div style="margin-top:0.25rem;"><span class="badge" style="background:var(--success);">${app.status}</span></div>
                        </div>
                    `).join('') : '<p style="color:var(--text-muted); text-align:center; padding:1rem;">No applications yet. Start applying to jobs!</p>'}
                </div>
            `;
            
            document.getElementById("editProfileBtn")?.addEventListener("click", () => {
                const bio = prompt("Enter your bio:", userData.bio || "");
                const title = prompt("Enter your title (e.g., Software Engineer):", userData.title || "");
                if (bio !== null || title !== null) updateDoc(doc(usersCol, currentUserId), { bio, title });
            });
            document.getElementById("addSkillBtn")?.addEventListener("click", () => {
                const skill = prompt("Enter a skill (e.g., JavaScript, React, Marketing):");
                if (skill) updateDoc(doc(usersCol, currentUserId), { skills: [...(userData.skills || []), skill] });
            });
        }

        // Create Post Modal
        function showCreatePostModal() {
            const modal = document.createElement("div");
            modal.className = "modal active";
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:1rem;">Create Post</h3>
                    <textarea id="postContent" placeholder="What's on your mind?" rows="4" style="width:100%; padding:0.875rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary); margin-bottom:1rem;"></textarea>
                    <button id="submitPost" class="btn-primary">Post</button>
                    <button class="close-modal" style="margin-top:0.75rem; background:transparent; border:1px solid var(--border); width:100%; padding:0.875rem; border-radius:0.75rem; cursor:pointer;">Cancel</button>
                </div>
            `;
            document.body.appendChild(modal);
            modal.querySelector("#submitPost")?.addEventListener("click", async () => {
                const content = modal.querySelector("#postContent").value;
                if (content.trim()) {
                    await addDoc(postsCol, {
                        content,
                        authorId: currentUserId,
                        authorName: currentUserData?.name,
                        timestamp: Timestamp.now(),
                        likes: 0,
                        comments: 0
                    });
                    showToast("Post created! 🎉");
                    modal.remove();
                    loadFeed();
                }
            });
            modal.querySelector(".close-modal")?.addEventListener("click", () => modal.remove());
        }

        // Render Main App
        async function renderMainApp() {
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            currentUserData = userDoc.data();
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink</div>
                    <div style="display:flex; gap:0.5rem;">
                        <button onclick="window.toggleTheme()" style="background:var(--bg-secondary); border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; color:var(--text-primary);"><i class="fas fa-moon"></i></button>
                        <button class="logout-btn" style="background:var(--danger); border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white; cursor:pointer; font-weight:500;">Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button data-nav="feed" class="active"><i class="fas fa-home"></i><span>Feed</span></button>
                    <button data-nav="jobs"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                </div>
                <div class="container">
                    <div id="feedView" class="view active">
                        <div id="feedContainer"></div>
                        <div class="card" style="text-align:center;">
                            <button id="createPostBtn" class="btn-primary"><i class="fas fa-plus"></i> Create Post</button>
                        </div>
                    </div>
                    <div id="jobsView" class="view"><div id="jobsContainer"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                </div>
            `;
            
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            document.querySelector(".logout-btn")?.addEventListener("click", () => signOut(auth));
            document.getElementById("createPostBtn")?.addEventListener("click", showCreatePostModal);
            
            loadFeed();
            loadJobs();
            loadProfile();
            navigateTo('feed');
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            renderMainApp();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserId = user.uid;
                const userDoc = await getDoc(doc(usersCol, user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(usersCol, user.uid), {
                        name: user.email.split('@')[0],
                        email: user.email,
                        role: "Job Seeker",
                        createdAt: Timestamp.now(),
                        verified: false,
                        bio: "",
                        title: "",
                        skills: []
                    });
                }
                renderDashboard();
            } else {
                currentUser = null;
                renderAuthScreen();
            }
        });
    </script>
</body>
</html>
