<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <title>JobLink – Find Jobs Faster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #f8fafc;
            --bg-card: white;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #eef2ff;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
        }
        body.dark {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 70px;
            transition: background 0.3s, color 0.3s;
        }
        .hero {
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        body.dark .hero {
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        .hero h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e40af, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: var(--bg-primary);
        }
        .auth-card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 460px;
            padding: 2rem;
        }
        .logo-large { text-align: center; margin-bottom: 2rem; }
        .logo-icon {
            font-size: 2rem;
            background: var(--accent-gradient);
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            color: white;
            margin-bottom: 1rem;
        }
        .auth-tabs {
            display: flex;
            gap: 0.75rem;
            background: var(--bg-primary);
            border-radius: 1rem;
            padding: 0.25rem;
            margin-bottom: 1.8rem;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
        }
        .tab-btn.active {
            background: var(--bg-card);
            color: var(--accent);
        }
        input, select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-1px); }
        .navbar {
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        .logo i { background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .nav-btn, .logout-btn {
            width: auto;
            padding: 0.5rem 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 0.75rem;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .nav-btn.active, .bottom-nav-btn.active {
            background: var(--accent-gradient);
            color: white;
        }
        .logout-btn { background: #ef4444; color: white; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            display: none;
            justify-content: space-around;
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            width: auto;
            padding: 4px 12px;
        }
        .bottom-nav button i { font-size: 20px; }
        .bottom-nav button.active { color: var(--accent); background: none; }
        .dashboard-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .view { display: none; animation: fadeIn 0.25s ease; }
        .view.active { display: block; }
        h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .job-card {
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .job-card:hover { transform: translateY(-3px); }
        .job-header {
            padding: 1.5rem 1.5rem 0.75rem;
            display: flex;
            gap: 1rem;
        }
        .company-logo {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, #eff6ff, #dbeafe);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            flex-shrink: 0;
        }
        body.dark .company-logo { background: linear-gradient(145deg, #334155, #1e293b); }
        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 0.5rem 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-primary);
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
        }
        .boost-badge { background: #fef3c7; color: #d97706; }
        .job-actions {
            padding: 1rem 1.5rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            border-top: 1px solid var(--border);
        }
        .job-actions button {
            width: auto;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .job-actions .apply-btn { background: var(--accent-gradient); color: white; }
        .save-btn.saved { background: #ec489a; color: white; }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }
        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.7rem 1.2rem;
            border-radius: 0.75rem;
            z-index: 2000;
            font-size: 0.85rem;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            max-width: 500px;
            width: 90%;
            border-radius: 1.25rem;
            padding: 1.5rem;
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .bottom-nav { display: flex; }
            .navbar .nav-links { display: none; }
            .hero h1 { font-size: 1.4rem; }
            .stats { gap: 1rem; }
        }
        @media (max-width: 480px) {
            .jobs-grid { grid-template-columns: 1fr; }
            .dashboard-content { padding: 0 1rem; }
        }
    </style>
    <script>
        window.onerror = function(msg, src, line) {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed; bottom:80px; left:10px; background:#dc2626; color:white; padding:8px; border-radius:8px; z-index:9999; font-size:11px; max-width:90%;';
            div.innerHTML = `⚠️ ${msg}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 8000);
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, Timestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const applicationsCol = collection(db, "applications");
        const savedJobsCol = collection(db, "savedJobs");
        const notificationsCol = collection(db, "notifications");

        let currentUser = null, userRole = null, currentUserId = null;
        let currentSavedJobsSet = new Set();
        let allJobsCache = [];

        function showToast(msg) { const t = document.createElement("div"); t.className = "toast-notification"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m)); }
        function isBoostActive(job) { if (!job.boosted) return false; const expiry = job.boostExpiry?.toDate ? job.boostExpiry.toDate() : new Date(job.boostExpiry); return expiry > new Date(); }
        function formatWhatsAppUrl(phone) { if (!phone) return null; let cleaned = phone.replace(/\s+/g, '').replace(/[()-]/g, ''); if (cleaned.startsWith('+')) cleaned = cleaned.substring(1); if (cleaned.match(/^\d{7,15}$/)) return `https://wa.me/${cleaned}`; return null; }

        // Dark mode
        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            if (saved === 'enabled') document.body.classList.add('dark');
            window.toggleDarkMode = () => {
                document.body.classList.toggle('dark');
                localStorage.setItem('darkMode', document.body.classList.contains('dark') ? 'enabled' : 'disabled');
            };
        }
        initDarkMode();

        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `<div class="auth-container"><div class="auth-card"><div class="logo-large"><div class="logo-icon"><i class="fas fa-briefcase"></i></div><h2 style="font-size:1.8rem;font-weight:800;">JobLink</h2><p>Connect · Hire · Grow</p></div><div class="auth-tabs"><button class="tab-btn active" data-tab="login">Sign in</button><button class="tab-btn" data-tab="signup">Create account</button></div><div id="loginPanel"><input type="email" id="loginEmail" placeholder="Email" /><input type="password" id="loginPassword" placeholder="Password" /><button id="doLogin"><i class="fas fa-arrow-right"></i> Sign in</button></div><div id="signupPanel" style="display:none;"><input type="text" id="signupName" placeholder="Full name" /><input type="email" id="signupEmail" placeholder="Email" /><input type="password" id="signupPassword" placeholder="Password" /><select id="signupRole"><option>Job Seeker</option><option>Employer</option><option>Admin</option></select><button id="doSignup"><i class="fas fa-user-plus"></i> Create account</button></div></div></div>`;
            const loginPanel = document.getElementById("loginPanel"), signupPanel = document.getElementById("signupPanel");
            const loginTab = document.querySelector('[data-tab="login"]'), signupTab = document.querySelector('[data-tab="signup"]');
            loginTab.onclick = () => { loginPanel.style.display = "block"; signupPanel.style.display = "none"; loginTab.classList.add("active"); signupTab.classList.remove("active"); };
            signupTab.onclick = () => { loginPanel.style.display = "none"; signupPanel.style.display = "block"; signupTab.classList.add("active"); loginTab.classList.remove("active"); };
            document.getElementById("doLogin").onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); showToast("Welcome back!"); } catch(e) { showToast(e.message); } };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value, email = document.getElementById("signupEmail").value, pwd = document.getElementById("signupPassword").value, role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try { const cred = await createUserWithEmailAndPassword(auth, email, pwd); await setDoc(doc(usersCol, cred.user.uid), { name, email, role, createdAt: Timestamp.now() }); showToast("Account created!"); } catch(e) { showToast(e.message); }
            };
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            if (userRole === "Job Seeker") renderJobSeekerDashboard();
            else if (userRole === "Employer") renderEmployerDashboard();
            else if (userRole === "Admin") renderAdminDashboard();
            else renderAuthScreen();
        }

        async function fetchSavedJobsSet() { 
            const q = query(savedJobsCol, where("userId", "==", currentUserId)); 
            const snap = await getDocs(q); 
            currentSavedJobsSet.clear(); 
            snap.forEach(d => currentSavedJobsSet.add(d.data().jobId)); 
        }
        
        async function toggleSaveJob(jobId) { 
            const ref = doc(savedJobsCol, `${currentUserId}_${jobId}`); 
            if (currentSavedJobsSet.has(jobId)) { 
                await deleteDoc(ref); 
                currentSavedJobsSet.delete(jobId); 
                showToast("Removed from bookmarks"); 
            } else { 
                await setDoc(ref, { userId: currentUserId, jobId, savedAt: Timestamp.now() }); 
                currentSavedJobsSet.add(jobId); 
                showToast("Job saved!"); 
            } 
            renderJobSeekerDashboard(); 
        }
        
        function renderJobCards(jobs, search = "") {
            const filtered = jobs.filter(j => !search || [j.title, j.category, j.location].some(f => f?.toLowerCase().includes(search.toLowerCase())));
            if (!filtered.length) return `<div class="empty-state"><i class="fas fa-search"></i><p>No jobs found</p></div>`;
            return filtered.map(job => {
                const logoLetter = (job.employerName || "C").charAt(0).toUpperCase();
                return `<div class="job-card"><div class="job-header"><div class="company-logo">${logoLetter}</div><div class="job-info"><h3>${escapeHtml(job.title)}</h3><div class="company-name"><i class="fas fa-building"></i> ${escapeHtml(job.employerName)}</div><div class="job-meta"><span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span><span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || "Negotiable")}</span></div><div><span class="badge"><i class="fas fa-tag"></i> ${escapeHtml(job.category)}</span>${isBoostActive(job) ? '<span class="badge boost-badge"><i class="fas fa-rocket"></i> Boosted</span>' : ''}</div></div></div><div class="job-actions"><button class="details-btn" data-id="${job.id}"><i class="fas fa-eye"></i> Details</button><button class="apply-btn" data-id="${job.id}"><i class="fas fa-paper-plane"></i> Apply</button><button class="save-btn ${currentSavedJobsSet.has(job.id) ? 'saved' : ''}" data-id="${job.id}"><i class="fas ${currentSavedJobsSet.has(job.id) ? 'fa-heart' : 'fa-heart'}"></i> ${currentSavedJobsSet.has(job.id) ? "Saved" : "Save"}</button></div></div>`;
            }).join("");
        }

        function showJobModal(job) {
            let contactHtml = ''; const contact = job.contactInfo || ''; const phoneUrl = formatWhatsAppUrl(contact);
            if (phoneUrl) contactHtml = `<a href="${phoneUrl}" target="_blank" style="display:inline-block; margin-top:0.5rem; background:#25D366; color:white; padding:0.4rem 1rem; border-radius:0.75rem; text-decoration:none;"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>`;
            else if (contact.includes('@')) contactHtml = `<a href="mailto:${contact}" style="display:inline-block; margin-top:0.5rem; background:var(--accent); color:white; padding:0.4rem 1rem; border-radius:0.75rem; text-decoration:none;"><i class="fas fa-envelope"></i> Send email</a>`;
            else contactHtml = `<p>No contact info</p>`;
            const m = document.createElement("div"); m.className = "modal";
            m.innerHTML = `<div class="modal-content"><h3><i class="fas fa-briefcase"></i> ${escapeHtml(job.title)}</h3><p><strong>${escapeHtml(job.employerName)}</strong></p><p><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}<br/><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary)}<br/><i class="fas fa-tag"></i> ${escapeHtml(job.category)}</p><p><strong>Description</strong><br/>${escapeHtml(job.description)}</p>${contactHtml}<button class="close-modal" style="margin-top:1rem; background:#64748b;">Close</button></div>`;
            document.body.appendChild(m); m.querySelector(".close-modal").onclick = () => m.remove();
        }

        function showApplyModal(job) {
            const m = document.createElement("div"); m.className = "modal";
            m.innerHTML = `<div class="modal-content"><h3><i class="fas fa-paper-plane"></i> Apply to ${escapeHtml(job.title)}</h3><input id="appName" placeholder="Full name" value="${escapeHtml(currentUser.displayName || currentUser.email)}" /><input id="appEmail" placeholder="Email" value="${currentUser.email}" /><input id="appPhone" placeholder="WhatsApp (optional)" /><textarea id="appMsg" placeholder="Why are you a good fit?" rows="3"></textarea><button id="submitApp"><i class="fas fa-send"></i> Submit application</button><button class="close-modal" style="margin-top:0.5rem; background:#64748b;">Cancel</button></div>`;
            document.body.appendChild(m);
            m.querySelector("#submitApp").onclick = async () => {
                const name = m.querySelector("#appName").value, email = m.querySelector("#appEmail").value, phone = m.querySelector("#appPhone").value, msg = m.querySelector("#appMsg").value;
                if (!name || !email) return showToast("Name and email required");
                await addDoc(applicationsCol, { jobId: job.id, applicantId: currentUserId, name, email, phone, message: msg, timestamp: Timestamp.now() });
                await addDoc(notificationsCol, { userId: job.employerId, title: `New application for ${job.title}`, message: `${name} applied to your job`, read: false, timestamp: Timestamp.now() });
                showToast("Application sent!"); m.remove();
            };
            m.querySelector(".close-modal").onclick = () => m.remove();
        }

        async function loadMyApplications() {
            const appsSnap = await getDocs(query(applicationsCol, where("applicantId", "==", currentUserId)));
            const myApps = [];
            for (const appDoc of appsSnap.docs) {
                const app = appDoc.data();
                const jobDoc = await getDoc(doc(jobsCol, app.jobId));
                if (jobDoc.exists()) myApps.push({ id: appDoc.id, ...app, job: jobDoc.data() });
            }
            const container = document.getElementById("myApplicationsList");
            if (container) {
                container.innerHTML = myApps.map(app => `<div class="job-card"><div class="job-header"><div class="company-logo">${(app.job.employerName || "C").charAt(0)}</div><div class="job-info"><h3>${escapeHtml(app.job.title)}</h3><div class="company-name">${escapeHtml(app.job.employerName)}</div><div class="job-meta"><span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(app.job.location)}</span></div><div class="badge">Applied: ${app.timestamp?.toDate().toLocaleDateString()}</div></div></div></div>`).join('');
            }
        }

        async function loadNotifications() {
            const notifSnap = await getDocs(query(notificationsCol, where("userId", "==", currentUserId), orderBy("timestamp", "desc")));
            const container = document.getElementById("notificationsList");
            if (container) {
                container.innerHTML = notifSnap.docs.map(d => `<div style="padding:1rem; border-bottom:1px solid var(--border);"><strong>${escapeHtml(d.data().title)}</strong><br/><small>${d.data().message}</small><br/><small style="color:var(--text-secondary);">${d.data().timestamp?.toDate().toLocaleString()}</small></div>`).join('');
            }
        }

        async function renderJobSeekerDashboard() {
            await fetchSavedJobsSet();
            const q = query(jobsCol, orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            allJobsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink</div>
                    <div class="nav-links">
                        <button class="nav-btn active" data-nav="home"><i class="fas fa-home"></i> Home</button>
                        <button class="nav-btn" data-nav="jobs"><i class="fas fa-list"></i> Jobs</button>
                        <button class="nav-btn" data-nav="my-apps"><i class="fas fa-file-alt"></i> My Apps</button>
                        <button class="nav-btn" data-nav="notifications"><i class="fas fa-bell"></i> Alerts</button>
                        <button class="nav-btn" data-nav="settings"><i class="fas fa-cog"></i> Settings</button>
                        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button class="bottom-nav-btn active" data-nav="home"><i class="fas fa-home"></i><span>Home</span></button>
                    <button class="bottom-nav-btn" data-nav="jobs"><i class="fas fa-search"></i><span>Jobs</span></button>
                    <button class="bottom-nav-btn" data-nav="my-apps"><i class="fas fa-file-alt"></i><span>Apps</span></button>
                    <button class="bottom-nav-btn" data-nav="settings"><i class="fas fa-cog"></i><span>Settings</span></button>
                </div>
                <div class="dashboard-content">
                    <div id="homeView" class="view active">
                        <div class="hero">
                            <h1>Find work faster with JobLink</h1>
                            <p>Connect with trusted employers in Nigeria</p>
                            <div class="stats">
                                <div class="stat"><div class="stat-number">10,000+</div><div class="stat-label">Jobs posted</div></div>
                                <div class="stat"><div class="stat-number">5,000+</div><div class="stat-label">Active employers</div></div>
                                <div class="stat"><div class="stat-number">8,000+</div><div class="stat-label">Hired</div></div>
                            </div>
                        </div>
                        <h2><i class="fas fa-fire"></i> Latest opportunities</h2>
                        <div class="search-bar"><input type="text" id="searchJobs" placeholder="Search by title, category or location..." /></div>
                        <div id="jobsContainer" class="jobs-grid">${renderJobCards(allJobsCache)}</div>
                    </div>
                    <div id="jobsView" class="view">
                        <h2><i class="fas fa-list"></i> All jobs</h2>
                        <div class="search-bar"><input type="text" id="jobsSearch" placeholder="Filter jobs..." /></div>
                        <div id="allJobsContainer" class="jobs-grid">${renderJobCards(allJobsCache)}</div>
                    </div>
                    <div id="my-appsView" class="view">
                        <h2><i class="fas fa-file-alt"></i> My Applications</h2>
                        <div id="myApplicationsList" class="jobs-grid"></div>
                    </div>
                    <div id="notificationsView" class="view">
                        <h2><i class="fas fa-bell"></i> Notifications</h2>
                        <div id="notificationsList"></div>
                    </div>
                    <div id="settingsView" class="view">
                        <h2><i class="fas fa-cog"></i> Settings</h2>
                        <div class="settings-item"><span><i class="fas fa-moon"></i> Dark Mode</span><button onclick="window.toggleDarkMode()" style="width:auto; padding:0.3rem 1rem;">Toggle</button></div>
                    </div>
                </div>
            `;
            
            // Navigation handlers - FIXED: properly attach to both desktop and mobile navs
            const navigateTo = (viewName) => {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                const targetView = document.getElementById(`${viewName}View`);
                if (targetView) targetView.classList.add('active');
                
                // Update active states for both navbars
                document.querySelectorAll('.nav-btn, .bottom-nav-btn').forEach(btn => {
                    if (btn.dataset.nav === viewName) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                
                // Load data when needed
                if (viewName === 'my-apps') loadMyApplications();
                if (viewName === 'notifications') loadNotifications();
            };
            
            // Desktop nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            
            // Bottom mobile nav buttons
            document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            
            // Logout
            document.querySelector('.logout-btn').onclick = () => signOut(auth);
            
            // Search handlers
            document.getElementById("searchJobs")?.addEventListener("input", e => {
                document.getElementById("jobsContainer").innerHTML = renderJobCards(allJobsCache, e.target.value);
            });
            document.getElementById("jobsSearch")?.addEventListener("input", e => {
                document.getElementById("allJobsContainer").innerHTML = renderJobCards(allJobsCache, e.target.value);
            });
            
            // Job action handlers
            document.addEventListener("click", (e) => {
                const details = e.target.closest(".details-btn");
                const apply = e.target.closest(".apply-btn");
                const save = e.target.closest(".save-btn");
                if (details) { const job = allJobsCache.find(j => j.id === details.dataset.id); if(job) showJobModal(job); }
                else if (apply) { const job = allJobsCache.find(j => j.id === apply.dataset.id); if(job) showApplyModal(job); }
                else if (save) toggleSaveJob(save.dataset.id);
            });
            
            // Preload data
            loadMyApplications();
            loadNotifications();
        }

        async function renderEmployerDashboard() {
            const jobsSnap = await getDocs(query(jobsCol, where("employerId", "==", currentUserId), orderBy("timestamp", "desc")));
            let jobs = []; jobsSnap.forEach(d => jobs.push({ id: d.id, ...d.data() }));
            
            const jobCardsHtml = jobs.map(job => {
                return `<div class="job-card"><div class="job-header"><div class="company-logo">${job.employerName?.charAt(0) || "E"}</div><div class="job-info"><h3>${escapeHtml(job.title)}</h3><div class="company-name">${escapeHtml(job.employerName)}</div><div class="job-meta">📍 ${escapeHtml(job.location)} | 💰 ${escapeHtml(job.salary)}</div></div></div><div class="job-actions"><button class="edit-job" data-id="${job.id}">Edit</button><button class="del-job" data-id="${job.id}">Delete</button>${!isBoostActive(job) ? `<button class="boost-job" data-id="${job.id}"><i class="fas fa-rocket"></i> Boost</button>` : ''}</div></div>`;
            }).join('');
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink (Employer)</div>
                    <div class="nav-links">
                        <button class="nav-btn active" data-nav="myjobs">My Jobs</button>
                        <button class="nav-btn" data-nav="postjob">Post Job</button>
                        <button class="nav-btn" data-nav="profile">Profile</button>
                        <button class="logout-btn">Logout</button>
                    </div>
                </nav>
                <div class="dashboard-content">
                    <div id="myjobsView" class="view active"><h2>Your listings</h2><div class="jobs-grid">${jobCardsHtml}</div></div>
                    <div id="postjobView" class="view">
                        <h2>Post a new job</h2>
                        <form id="postJobForm" style="background:var(--bg-card); padding:1.5rem; border-radius:1rem;">
                            <input id="title" placeholder="Job title" required/>
                            <textarea id="desc" placeholder="Job description" required rows="4"></textarea>
                            <input id="salary" placeholder="Salary"/>
                            <input id="location" placeholder="Location" required/>
                            <input id="category" placeholder="Category" required/>
                            <input id="contact" placeholder="WhatsApp number or Email" required/>
                            <button type="submit">Post Job</button>
                        </form>
                    </div>
                    <div id="profileView" class="view"><h2>Profile</h2><p>${escapeHtml(currentUser.displayName)}<br/>${currentUser.email}</p></div>
                </div>
            `;
            
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
                    document.getElementById(btn.dataset.nav + "View").classList.add("active");
                };
            });
            document.querySelector(".logout-btn").onclick = () => signOut(auth);
            
            document.getElementById("postJobForm")?.addEventListener("submit", async (e) => {
                e.preventDefault();
                await addDoc(jobsCol, {
                    title: document.getElementById("title").value,
                    description: document.getElementById("desc").value,
                    salary: document.getElementById("salary").value,
                    location: document.getElementById("location").value,
                    category: document.getElementById("category").value,
                    contactInfo: document.getElementById("contact").value,
                    employerId: currentUserId,
                    employerName: currentUser.displayName || currentUser.email,
                    timestamp: Timestamp.now(),
                    boosted: false,
                    boostExpiry: null
                });
                showToast("Job posted!");
                renderEmployerDashboard();
            });
            
            document.addEventListener("click", async (e) => {
                const edit = e.target.closest(".edit-job");
                const del = e.target.closest(".del-job");
                const boost = e.target.closest(".boost-job");
                if (edit) { const job = jobs.find(j => j.id === edit.dataset.id); showEditModal(edit.dataset.id, job); }
                else if (del) { if(confirm("Delete?")) await deleteDoc(doc(jobsCol, del.dataset.id)); renderEmployerDashboard(); }
                else if (boost) { const expiry = Timestamp.fromDate(new Date(Date.now() + 30*86400000)); await updateDoc(doc(jobsCol, boost.dataset.id), { boosted: true, boostExpiry: expiry }); showToast("Job boosted!"); renderEmployerDashboard(); }
            });
        }

        async function showEditModal(jobId, jobData) {
            const modal = document.createElement("div"); modal.className = "modal";
            modal.innerHTML = `<div class="modal-content"><h3>Edit job</h3><input id="editTitle" value="${escapeHtml(jobData.title)}"/><textarea id="editDesc" rows="4">${escapeHtml(jobData.description)}</textarea><input id="editSalary" value="${escapeHtml(jobData.salary||'')}"/><input id="editLocation" value="${escapeHtml(jobData.location)}"/><input id="editCategory" value="${escapeHtml(jobData.category)}"/><input id="editContact" value="${escapeHtml(jobData.contactInfo||'')}"/><button id="saveEdit">Save</button><button class="close-modal">Cancel</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector("#saveEdit").onclick = async () => {
                await updateDoc(doc(jobsCol, jobId), { title: modal.querySelector("#editTitle").value, description: modal.querySelector("#editDesc").value, salary: modal.querySelector("#editSalary").value, location: modal.querySelector("#editLocation").value, category: modal.querySelector("#editCategory").value, contactInfo: modal.querySelector("#editContact").value });
                showToast("Updated"); modal.remove(); renderEmployerDashboard();
            };
            modal.querySelector(".close-modal").onclick = () => modal.remove();
        }

        async function renderAdminDashboard() {
            const users = (await getDocs(usersCol)).docs.map(d => ({ id: d.id, ...d.data() }));
            const jobs = (await getDocs(jobsCol)).docs.map(d => ({ id: d.id, ...d.data() }));
            const apps = (await getDocs(applicationsCol)).docs;
            document.getElementById("app").innerHTML = `
                <nav class="navbar"><div class="logo"><i class="fas fa-shield-alt"></i> JobLink Admin</div><button class="logout-btn">Logout</button></nav>
                <div style="background:var(--bg-card); margin:2rem; border-radius:1rem; padding:2rem;">
                    <h2>Analytics</h2>
                    <div style="display:flex; gap:2rem; flex-wrap:wrap; margin-bottom:2rem;">
                        <div class="stat"><div class="stat-number">${users.length}</div><div>Users</div></div>
                        <div class="stat"><div class="stat-number">${jobs.length}</div><div>Jobs</div></div>
                        <div class="stat"><div class="stat-number">${apps.length}</div><div>Applications</div></div>
                    </div>
                    <h2>Users</h2>
                    ${users.map(u => `<div style="display:flex; justify-content:space-between; padding:0.75rem; border-bottom:1px solid var(--border);"><span>${u.email}</span><span>${u.role}</span><button class="del-user" data-id="${u.id}" style="width:auto; background:#ef4444; padding:0.3rem 0.8rem;">Delete</button></div>`).join('')}
                    <h2 style="margin-top:2rem;">Jobs</h2>
                    ${jobs.map(j => `<div style="display:flex; justify-content:space-between; padding:0.75rem; border-bottom:1px solid var(--border);"><span>${j.title}</span><span>${j.employerName}</span><button class="del-job" data-id="${j.id}" style="width:auto; background:#ef4444; padding:0.3rem 0.8rem;">Delete</button></div>`).join('')}
                </div>
            `;
            document.querySelector(".logout-btn").onclick = () => signOut(auth);
            document.querySelectorAll(".del-user").forEach(btn => btn.onclick = async () => { if(confirm("Delete user?")) await deleteDoc(doc(usersCol, btn.dataset.id)); renderAdminDashboard(); });
            document.querySelectorAll(".del-job").forEach(btn => btn.onclick = async () => { if(confirm("Delete job?")) await deleteDoc(doc(jobsCol, btn.dataset.id)); renderAdminDashboard(); });
        }

        // Auth state listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user; currentUserId = user.uid;
                try {
                    const userDoc = await getDoc(doc(usersCol, user.uid));
                    if (userDoc.exists()) {
                        userRole = userDoc.data().role;
                        currentUser.displayName = userDoc.data().name || user.email;
                    } else {
                        const defaultName = user.email.split('@')[0];
                        await setDoc(doc(usersCol, user.uid), { name: defaultName, email: user.email, role: "Job Seeker", createdAt: Timestamp.now() });
                        userRole = "Job Seeker";
                        currentUser.displayName = defaultName;
                    }
                } catch(e) { console.error(e); userRole = "Job Seeker"; }
                renderDashboard();
            } else {
                currentUser = null; userRole = null;
                renderAuthScreen();
            }
        });
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
