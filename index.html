<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JobLink – Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-card: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7a;
            --border: rgba(255,255,255,0.08);
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --success: #10b981;
            --danger: #ef4444;
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
            --transition: all 0.3s ease;
        }
        
        body.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            padding-bottom: 70px;
        }
        
        .navbar {
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-radius: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            z-index: 100;
        }
        
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 1.5rem;
            transition: var(--transition);
        }
        
        .bottom-nav button i { font-size: 20px; }
        .bottom-nav button.active { background: var(--accent-gradient); color: white; }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: 80px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: var(--transition);
        }
        
        .job-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .company-logo {
            width: 52px;
            height: 52px;
            background: var(--accent-gradient);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            flex-shrink: 0;
        }
        
        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0.5rem 0;
        }
        
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.7rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }
        
        .job-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .job-actions button {
            flex: 1;
            padding: 0.6rem;
            border-radius: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .save-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        
        .view-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        
        .apply-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
        }
        
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gradient);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            z-index: 2000;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        @media (max-width: 768px) {
            .container { padding: 0.75rem; padding-bottom: 80px; }
            .bottom-nav { width: calc(100% - 24px); padding: 6px 8px; }
            .bottom-nav button { padding: 6px 12px; }
            .job-actions button { font-size: 0.75rem; padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, Timestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const applicationsCol = collection(db, "applications");
        const savedJobsCol = collection(db, "savedJobs");

        let currentUser = null, currentUserId = null;
        let currentUserData = null;
        let savedJobsSet = new Set();

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            const diff = Math.floor((Date.now() - date) / 1000 / 60);
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${diff}m ago`;
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
            return `${Math.floor(diff / 1440)}d ago`;
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') document.body.classList.add('light');
        }
        window.toggleTheme = () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        };
        initTheme();

        function navigateTo(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                if (btn.dataset.nav === view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (view === 'jobs') loadJobs();
            if (view === 'profile') loadProfile();
        }

        // Auth screen
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem; background:var(--bg-primary);">
                    <div style="background:var(--bg-card); border-radius:2rem; max-width:460px; width:100%; padding:2rem; border:1px solid var(--border); box-shadow:var(--shadow-lg);">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="font-size:2.5rem; background:var(--accent-gradient); width:80px; height:80px; display:inline-flex; align-items:center; justify-content:center; border-radius:1.5rem; margin-bottom:1rem;">
                                <i class="fas fa-briefcase" style="color:white; font-size:2rem;"></i>
                            </div>
                            <h1 style="font-size:1.8rem; font-weight:800;">JobLink</h1>
                            <p style="color:var(--text-secondary);">Africa's Professional Network</p>
                        </div>
                        <div style="display:flex; gap:1rem; background:var(--bg-secondary); border-radius:1rem; padding:0.5rem; margin-bottom:2rem;">
                            <button class="tab-btn active" id="loginTabBtn" style="flex:1; padding:0.9rem; font-size:1rem; font-weight:700; border:none; border-radius:0.75rem; cursor:pointer; background:var(--accent-gradient); color:white;">Sign In</button>
                            <button class="tab-btn inactive" id="signupTabBtn" style="flex:1; padding:0.9rem; font-size:1rem; font-weight:700; border:none; border-radius:0.75rem; cursor:pointer; background:transparent; color:var(--text-secondary);">Create Account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" placeholder="Email address" style="width:100%; padding:0.875rem; margin-bottom:1rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                            <input type="password" id="loginPassword" placeholder="Password" style="width:100%; padding:0.875rem; margin-bottom:1.5rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                            <button id="doLogin" class="btn-primary">Sign In →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" placeholder="Full name" style="width:100%; padding:0.875rem; margin-bottom:1rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                            <input type="email" id="signupEmail" placeholder="Email address" style="width:100%; padding:0.875rem; margin-bottom:1rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                            <input type="password" id="signupPassword" placeholder="Password" style="width:100%; padding:0.875rem; margin-bottom:1rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                            <select id="signupRole" style="width:100%; padding:0.875rem; margin-bottom:1.5rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary);">
                                <option value="Job Seeker">Job Seeker</option>
                                <option value="Employer">Employer</option>
                            </select>
                            <button id="doSignup" class="btn-primary">Create Account →</button>
                        </div>
                    </div>
                </div>
            `;
            
            const loginPanel = document.getElementById("loginPanel");
            const signupPanel = document.getElementById("signupPanel");
            const loginBtn = document.getElementById("loginTabBtn");
            const signupBtn = document.getElementById("signupTabBtn");
            
            loginBtn.onclick = () => {
                loginPanel.style.display = "block";
                signupPanel.style.display = "none";
                loginBtn.style.background = "var(--accent-gradient)";
                loginBtn.style.color = "white";
                signupBtn.style.background = "transparent";
                signupBtn.style.color = "var(--text-secondary)";
            };
            signupBtn.onclick = () => {
                loginPanel.style.display = "none";
                signupPanel.style.display = "block";
                signupBtn.style.background = "var(--accent-gradient)";
                signupBtn.style.color = "white";
                loginBtn.style.background = "transparent";
                loginBtn.style.color = "var(--text-secondary)";
            };
            
            document.getElementById("doLogin").onclick = async () => {
                try {
                    await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
                    showToast("Welcome back! 👋");
                } catch(e) { showToast(e.message); }
            };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value;
                const email = document.getElementById("signupEmail").value;
                const pwd = document.getElementById("signupPassword").value;
                const role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { 
                        name, email, role, 
                        createdAt: Timestamp.now(), 
                        bio: "Professional", 
                        title: "Job Seeker"
                    });
                    showToast("Account created! 🎉");
                } catch(e) { showToast(e.message); }
            };
        }

        // Load saved jobs set
        async function loadSavedJobsSet() {
            try {
                const q = query(savedJobsCol, where("userId", "==", currentUserId));
                const snap = await getDocs(q);
                savedJobsSet.clear();
                snap.forEach(d => savedJobsSet.add(d.data().jobId));
            } catch(e) { console.error("Saved jobs error", e); }
        }

        async function toggleSaveJob(jobId) {
            const ref = doc(savedJobsCol, `${currentUserId}_${jobId}`);
            if (savedJobsSet.has(jobId)) {
                await deleteDoc(ref);
                savedJobsSet.delete(jobId);
                showToast("Removed from saved jobs");
            } else {
                await setDoc(ref, { userId: currentUserId, jobId, savedAt: Timestamp.now() });
                savedJobsSet.add(jobId);
                showToast("Job saved! 💾");
            }
            loadJobs();
        }

        // Load Jobs (with fallback demo data if Firestore empty)
        async function loadJobs() {
            await loadSavedJobsSet();
            const jobsContainer = document.getElementById("jobsContainer");
            if (!jobsContainer) return;
            
            jobsContainer.innerHTML = `<div class="loader"></div>`;
            
            let jobs = [];
            try {
                const q = query(jobsCol, orderBy("timestamp", "desc"), limit(50));
                const jobsSnap = await getDocs(q);
                jobs = jobsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch(e) {
                console.error("Jobs fetch error", e);
            }
            
            // Fallback demo jobs if no data
            if (jobs.length === 0) {
                jobs = [
                    { id: "1", title: "Sales Girl", employerName: "Ejim", location: "One day Enugu State Nigeria", salary: "₦60,000", description: "Looking for a dedicated sales girl", timestamp: Timestamp.now(), type: "Full-time" },
                    { id: "2", title: "Nanny", employerName: "Ejim", location: "Amechi Enugu State Nigeria", salary: "₦100,000 monthly", description: "Seeking an experienced nanny", timestamp: Timestamp.now(), type: "Full-time" }
                ];
            }
            
            jobsContainer.innerHTML = jobs.map(job => `
                <div class="card">
                    <div class="job-header">
                        <div class="company-logo"><i class="fas fa-building"></i></div>
                        <div style="flex:1;">
                            <h3 style="font-size:1rem; font-weight:700;">${escapeHtml(job.title)}</h3>
                            <div style="font-size:0.8rem; color:var(--accent); margin:0.25rem 0;">${escapeHtml(job.employerName)}</div>
                            <div class="job-details">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</span>
                                <span><i class="fas fa-clock"></i> ${getTimeAgo(job.timestamp)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="job-actions">
                        <button class="save-btn" data-id="${job.id}">
                            <i class="fas ${savedJobsSet.has(job.id) ? 'fa-bookmark' : 'fa-bookmark'}"></i> ${savedJobsSet.has(job.id) ? 'Saved' : 'Save'}
                        </button>
                        <button class="view-btn" data-id="${job.id}">View Details</button>
                        <button class="apply-btn" data-id="${job.id}">Apply Now</button>
                    </div>
                </div>
            `).join('');
            
            // Save button
            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.onclick = async () => await toggleSaveJob(btn.dataset.id);
            });
            
            // View Details modal
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.onclick = async () => {
                    const jobId = btn.dataset.id;
                    const job = jobs.find(j => j.id === jobId);
                    if (!job) return;
                    const modal = document.createElement("div");
                    modal.className = "modal active";
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h2 style="margin-bottom:0.5rem;">${escapeHtml(job.title)}</h2>
                            <p style="color:var(--accent); margin-bottom:1rem;">${escapeHtml(job.employerName)}</p>
                            <div style="margin-bottom:1rem;">
                                <p><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</p>
                                <p><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</p>
                                <p><i class="fas fa-clock"></i> Posted ${getTimeAgo(job.timestamp)}</p>
                            </div>
                            <p><strong>Description:</strong><br/>${escapeHtml(job.description || 'No description provided.')}</p>
                            <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
                                <button class="apply-now" data-id="${job.id}" style="flex:1; background:var(--accent-gradient); border:none; padding:0.75rem; border-radius:0.75rem; color:white;">Apply Now</button>
                                <button class="close-modal" style="flex:1; background:transparent; border:1px solid var(--border); padding:0.75rem; border-radius:0.75rem;">Close</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    modal.querySelector(".apply-now")?.onclick = async () => {
                        await applyForJob(job.id);
                        modal.remove();
                    };
                    modal.querySelector(".close-modal")?.onclick = () => modal.remove();
                };
            });
            
            // Apply button
            document.querySelectorAll('.apply-btn').forEach(btn => {
                btn.onclick = async () => await applyForJob(btn.dataset.id);
            });
        }
        
        async function applyForJob(jobId) {
            try {
                const existing = await getDocs(query(applicationsCol, where("jobId", "==", jobId), where("applicantId", "==", currentUserId)));
                if (!existing.empty) return showToast("You already applied for this job");
                await addDoc(applicationsCol, { jobId, applicantId: currentUserId, status: 'applied', appliedAt: Timestamp.now() });
                showToast("Application submitted! 🎉");
            } catch(e) { showToast("Error applying. Please try again."); }
        }

        // Profile
        async function loadProfile() {
            const profileContainer = document.getElementById("profileContainer");
            if (!profileContainer) return;
            
            profileContainer.innerHTML = `<div class="loader"></div>`;
            
            try {
                const userDoc = await getDoc(doc(usersCol, currentUserId));
                if (!userDoc.exists()) throw new Error("User not found");
                const userData = userDoc.data();
                currentUserData = userData;
                
                // Get applications
                let applications = [];
                try {
                    const appsSnap = await getDocs(query(applicationsCol, where("applicantId", "==", currentUserId)));
                    for (const appDoc of appsSnap.docs) {
                        const app = appDoc.data();
                        const jobDoc = await getDoc(doc(jobsCol, app.jobId));
                        if (jobDoc.exists()) applications.push({ ...app, job: jobDoc.data() });
                    }
                } catch(e) { console.warn("Could not load applications", e); }
                
                profileContainer.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <div style="width:80px; height:80px; background:var(--accent-gradient); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 1rem;">${escapeHtml(userData.name?.charAt(0) || 'U')}</div>
                        <h2>${escapeHtml(userData.name)}</h2>
                        <p style="color:var(--text-secondary);">${escapeHtml(userData.title || 'Professional')}</p>
                        <p style="margin:1rem 0;">${escapeHtml(userData.bio || 'No bio yet.')}</p>
                        <button id="editProfileBtn" class="btn-outline">Edit Profile</button>
                    </div>
                    <div class="card">
                        <h3>My Applications (${applications.length})</h3>
                        ${applications.length ? applications.map(app => `
                            <div style="padding:0.75rem 0; border-bottom:1px solid var(--border);">
                                <div><strong>${escapeHtml(app.job.title)}</strong></div>
                                <div class="job-details">${escapeHtml(app.job.employerName)} • Status: ${escapeHtml(app.status)}</div>
                            </div>
                        `).join('') : '<p style="text-align:center; padding:1rem;">No applications yet.</p>'}
                    </div>
                `;
                
                document.getElementById("editProfileBtn")?.addEventListener("click", () => {
                    const bio = prompt("Enter your bio:", userData.bio || "");
                    const title = prompt("Enter your title:", userData.title || "");
                    if (bio !== null) updateDoc(doc(usersCol, currentUserId), { bio });
                    if (title !== null) updateDoc(doc(usersCol, currentUserId), { title });
                    if (bio !== null || title !== null) { showToast("Profile updated"); loadProfile(); }
                });
            } catch(e) {
                console.error("Profile error", e);
                profileContainer.innerHTML = `<div class="card" style="text-align:center;">Failed to load profile. Please try again later.</div>`;
            }
        }

        // Main app render
        async function renderMainApp() {
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            currentUserData = userDoc.data();
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo">JobLink</div>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button onclick="window.toggleTheme()" style="background:var(--bg-secondary); border:none; width:40px; height:40px; border-radius:50%; cursor:pointer;"><i class="fas fa-moon"></i></button>
                        <button class="logout-btn" style="background:var(--danger); border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white; cursor:pointer;">Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button data-nav="jobs" class="active"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                </div>
                <div class="container">
                    <div id="jobsView" class="view active"><div id="jobsContainer"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                </div>
            `;
            
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            document.querySelector(".logout-btn")?.addEventListener("click", () => signOut(auth));
            
            await loadJobs();
            await loadProfile();
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            renderMainApp();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserId = user.uid;
                const userDoc = await getDoc(doc(usersCol, user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(usersCol, user.uid), {
                        name: user.email.split('@')[0],
                        email: user.email,
                        role: "Job Seeker",
                        createdAt: Timestamp.now(),
                        bio: "",
                        title: "Job Seeker"
                    });
                }
                renderDashboard();
            } else {
                currentUser = null;
                renderAuthScreen();
            }
        });
    </script>
</body>
</html>
