<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="JobLink - Africa's fastest growing professional network. Find jobs, connect with employers, grow your career.">
    <title>JobLink – Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-card: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7a;
            --border: rgba(255,255,255,0.08);
            --accent: #3b82f6;
            --accent-2: #6366f1;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
            --transition: all 0.3s ease;
        }
        
        body.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: rgba(0,0,0,0.06);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            padding-bottom: 70px;
        }
        
        /* Notification Badge */
        .notification-badge {
            position: relative;
        }
        
        .badge-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        .navbar {
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-radius: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            z-index: 100;
        }
        
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 1.5rem;
            transition: var(--transition);
            position: relative;
        }
        
        .bottom-nav button i { font-size: 20px; }
        .bottom-nav button.active { background: var(--accent-gradient); color: white; }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: 80px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: var(--transition);
        }
        
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .post-header, .chat-header, .message-header {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
            object-fit: cover;
        }
        
        .avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .small-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        /* Chat Styles */
        .chat-list {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .chat-item:hover { background: var(--bg-secondary); }
        .chat-item.unread { background: var(--bg-secondary); }
        
        .chat-preview {
            flex: 1;
        }
        
        .chat-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .chat-last-message {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .unread-indicator {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
        }
        
        .chat-messages-container {
            display: flex;
            flex-direction: column;
            height: 60vh;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .message {
            max-width: 80%;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
        }
        
        .message.sent {
            background: var(--accent-gradient);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        
        .message.received {
            background: var(--bg-secondary);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        
        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* Notification Item */
        .notification-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        
        .notification-item.unread {
            background: var(--bg-secondary);
        }
        
        .notification-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }
        
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.7rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gradient);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            z-index: 2000;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.3s ease;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 0.75rem; padding-bottom: 80px; }
            .bottom-nav { width: calc(100% - 24px); padding: 6px 8px; }
            .bottom-nav button { padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, Timestamp, addDoc, onSnapshot, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const postsCol = collection(db, "posts");
        const applicationsCol = collection(db, "applications");
        const likesCol = collection(db, "likes");
        const commentsCol = collection(db, "comments");
        const savedJobsCol = collection(db, "savedJobs");
        const followersCol = collection(db, "followers");
        const chatsCol = collection(db, "chats");
        const messagesCol = collection(db, "messages");
        const notificationsCol = collection(db, "notifications");

        let currentUser = null, currentUserId = null;
        let currentUserData = null;
        let currentFilter = "all";
        let currentJobFilter = "all";
        let searchKeyword = "";
        let savedJobsSet = new Set();
        let messagesUnsubscribe = null;
        let notificationsUnsubscribe = null;
        let unreadCount = 0;

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            const diff = Math.floor((Date.now() - date) / 1000 / 60);
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${diff}m ago`;
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
            return `${Math.floor(diff / 1440)}d ago`;
        }

        // Create notification
        async function createNotification(userId, type, title, message, relatedId = null) {
            await addDoc(notificationsCol, {
                userId,
                type,
                title,
                message,
                relatedId,
                read: false,
                createdAt: Timestamp.now()
            });
            // Update unread count in real-time
            if (userId === currentUserId) {
                unreadCount++;
                updateNotificationBadge();
            }
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notificationBadge');
            if (badge) {
                if (unreadCount > 0) {
                    badge.style.display = 'block';
                    badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        // Load unread notifications count
        async function loadUnreadCount() {
            const snap = await getDocs(query(notificationsCol, where("userId", "==", currentUserId), where("read", "==", false)));
            unreadCount = snap.size;
            updateNotificationBadge();
        }

        // Theme
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') document.body.classList.add('light');
        }
        window.toggleTheme = () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        };
        initTheme();

        function navigateTo(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                if (btn.dataset.nav === view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (view === 'feed') loadFeed();
            if (view === 'jobs') loadJobs();
            if (view === 'profile') loadProfile();
            if (view === 'network') loadNetwork();
            if (view === 'notifications') loadNotifications();
            if (view === 'messages') loadChats();
        }

        // Auth Screen
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div class="auth-container" style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem;">
                    <div style="background:var(--bg-card); border-radius:2rem; max-width:460px; width:100%; padding:2rem; border:1px solid var(--border); box-shadow:var(--shadow-lg);">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="font-size:2.5rem; background:var(--accent-gradient); width:80px; height:80px; display:inline-flex; align-items:center; justify-content:center; border-radius:1.5rem; margin-bottom:1rem; box-shadow:0 0 30px rgba(59,130,246,0.3);">
                                <i class="fas fa-briefcase" style="color:white; font-size:2rem;"></i>
                            </div>
                            <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:0.25rem;">JobLink</h1>
                            <p style="color:var(--text-secondary);">Africa's Professional Network</p>
                        </div>
                        <div style="display:flex; gap:1rem; background:var(--bg-secondary); border-radius:1rem; padding:0.5rem; margin-bottom:2rem;">
                            <button class="tab-btn active" id="loginTabBtn" style="flex:1; padding:0.9rem; font-size:1rem; font-weight:700; border:none; border-radius:0.75rem; cursor:pointer; background:var(--accent-gradient); color:white;">Sign In</button>
                            <button class="tab-btn inactive" id="signupTabBtn" style="flex:1; padding:0.9rem; font-size:1rem; font-weight:700; border:none; border-radius:0.75rem; cursor:pointer; background:transparent; color:var(--text-secondary);">Create Account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" class="search-input" placeholder="Email address" style="margin-bottom:1rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                            <input type="password" id="loginPassword" class="search-input" placeholder="Password" style="margin-bottom:1.5rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                            <button id="doLogin" class="btn-primary">Sign In →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" class="search-input" placeholder="Full name" style="margin-bottom:1rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                            <input type="email" id="signupEmail" class="search-input" placeholder="Email address" style="margin-bottom:1rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                            <input type="password" id="signupPassword" class="search-input" placeholder="Password" style="margin-bottom:1rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                            <select id="signupRole" class="search-input" style="margin-bottom:1.5rem; width:100%; padding:0.875rem; border-radius:2rem; background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary);">
                                <option value="Job Seeker">Job Seeker</option>
                                <option value="Employer">Employer</option>
                            </select>
                            <button id="doSignup" class="btn-primary">Create Account →</button>
                        </div>
                    </div>
                </div>
            `;
            
            const loginPanel = document.getElementById("loginPanel");
            const signupPanel = document.getElementById("signupPanel");
            const loginBtn = document.getElementById("loginTabBtn");
            const signupBtn = document.getElementById("signupTabBtn");
            
            loginBtn.onclick = () => {
                loginPanel.style.display = "block";
                signupPanel.style.display = "none";
                loginBtn.style.background = "var(--accent-gradient)";
                loginBtn.style.color = "white";
                signupBtn.style.background = "transparent";
                signupBtn.style.color = "var(--text-secondary)";
            };
            
            signupBtn.onclick = () => {
                loginPanel.style.display = "none";
                signupPanel.style.display = "block";
                signupBtn.style.background = "var(--accent-gradient)";
                signupBtn.style.color = "white";
                loginBtn.style.background = "transparent";
                loginBtn.style.color = "var(--text-secondary)";
            };
            
            document.getElementById("doLogin").onclick = async () => {
                try {
                    await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
                    showToast("Welcome back! 👋");
                } catch(e) { showToast(e.message); }
            };
            
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value;
                const email = document.getElementById("signupEmail").value;
                const pwd = document.getElementById("signupPassword").value;
                const role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { 
                        name, email, role, 
                        createdAt: Timestamp.now(), 
                        verified: false, 
                        bio: "", 
                        title: "", 
                        skills: [],
                        avatarUrl: "",
                        openToWork: false
                    });
                    showToast("Account created! 🎉");
                } catch(e) { showToast(e.message); }
            };
        }

        // Load Notifications
        async function loadNotifications() {
            const notificationsContainer = document.getElementById("notificationsContainer");
            if (!notificationsContainer) return;
            
            notificationsContainer.innerHTML = `<div class="loader"></div>`;
            
            const notifSnap = await getDocs(query(notificationsCol, where("userId", "==", currentUserId), orderBy("createdAt", "desc"), limit(50)));
            
            // Mark all as read
            for (const doc of notifSnap.docs) {
                if (!doc.data().read) {
                    await updateDoc(doc.ref, { read: true });
                }
            }
            unreadCount = 0;
            updateNotificationBadge();
            
            const notifications = notifSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            if (notifications.length === 0) {
                notificationsContainer.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <i class="fas fa-bell" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
                        <h3>No notifications yet</h3>
                        <p style="color:var(--text-muted);">When someone likes your post or follows you, you'll see it here.</p>
                    </div>
                `;
                return;
            }
            
            const getIcon = (type) => {
                switch(type) {
                    case 'like': return '<i class="fas fa-heart"></i>';
                    case 'comment': return '<i class="fas fa-comment"></i>';
                    case 'follow': return '<i class="fas fa-user-plus"></i>';
                    case 'application': return '<i class="fas fa-paper-plane"></i>';
                    default: return '<i class="fas fa-bell"></i>';
                }
            };
            
            notificationsContainer.innerHTML = notifications.map(notif => `
                <div class="notification-item ${!notif.read ? 'unread' : ''}">
                    <div class="notification-icon">${getIcon(notif.type)}</div>
                    <div style="flex:1;">
                        <div style="font-weight:600;">${escapeHtml(notif.title)}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${escapeHtml(notif.message)}</div>
                        <div style="font-size:0.7rem; color:var(--text-muted); margin-top:0.25rem;">${getTimeAgo(notif.createdAt)}</div>
                    </div>
                </div>
            `).join('');
        }

        // Chat Functions
        async function loadChats() {
            const chatsContainer = document.getElementById("chatsContainer");
            if (!chatsContainer) return;
            
            chatsContainer.innerHTML = `<div class="loader"></div>`;
            
            const chatsSnap = await getDocs(query(chatsCol, where("participants", "array-contains", currentUserId), orderBy("updatedAt", "desc")));
            const chats = chatsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            if (chats.length === 0) {
                chatsContainer.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <i class="fas fa-comments" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
                        <h3>No messages yet</h3>
                        <p style="color:var(--text-muted); margin-bottom:1rem;">Connect with employers or team members to start chatting.</p>
                        <button id="searchPeopleBtn" class="btn-primary">Find People to Message</button>
                    </div>
                `;
                document.getElementById("searchPeopleBtn")?.addEventListener("click", () => navigateTo('network'));
                return;
            }
            
            // Get user names for each chat
            const chatsWithNames = await Promise.all(chats.map(async (chat) => {
                const otherId = chat.participants.find(p => p !== currentUserId);
                const userDoc = await getDoc(doc(usersCol, otherId));
                const userData = userDoc.data();
                return {
                    ...chat,
                    otherUser: { id: otherId, name: userData?.name || 'User', avatarUrl: userData?.avatarUrl }
                };
            }));
            
            chatsContainer.innerHTML = `
                <div class="card" style="padding:0; overflow:hidden;">
                    <div class="chat-list">
                        ${chatsWithNames.map(chat => `
                            <div class="chat-item" data-chat-id="${chat.id}" data-user-id="${chat.otherUser.id}">
                                ${chat.otherUser.avatarUrl ? 
                                    `<img src="${chat.otherUser.avatarUrl}" class="small-avatar" onerror="this.src=''">` : 
                                    `<div class="small-avatar" style="background:var(--accent-gradient); display:flex; align-items:center; justify-content:center;">${escapeHtml(chat.otherUser.name?.charAt(0) || 'U')}</div>`
                                }
                                <div class="chat-preview">
                                    <div class="chat-name">${escapeHtml(chat.otherUser.name)}</div>
                                    <div class="chat-last-message">${escapeHtml(chat.lastMessage || 'No messages yet')}</div>
                                </div>
                                <div class="chat-time">${getTimeAgo(chat.updatedAt)}</div>
                                ${chat.unreadCount?.[currentUserId] ? '<div class="unread-indicator"></div>' : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.chat-item').forEach(item => {
                item.onclick = () => openChat(item.dataset.chatId, item.dataset.userId);
            });
        }
        
        let currentChatId = null;
        let messageUnsubscribe = null;
        
        async function openChat(chatId, otherUserId) {
            currentChatId = chatId;
            const chatArea = document.getElementById("chatAreaView");
            if (!chatArea) return;
            
            const otherUserDoc = await getDoc(doc(usersCol, otherUserId));
            const otherUser = otherUserDoc.data();
            
            chatArea.innerHTML = `
                <div class="card" style="padding:0; overflow:hidden; display:flex; flex-direction:column; height:70vh;">
                    <div class="chat-header" style="padding:1rem; border-bottom:1px solid var(--border);">
                        <div style="display:flex; align-items:center; gap:0.75rem;">
                            <button id="backToChats" style="background:none; border:none; color:var(--text-primary); cursor:pointer;"><i class="fas fa-arrow-left"></i></button>
                            ${otherUser?.avatarUrl ? 
                                `<img src="${otherUser.avatarUrl}" class="small-avatar">` : 
                                `<div class="small-avatar" style="background:var(--accent-gradient); display:flex; align-items:center; justify-content:center;">${escapeHtml(otherUser?.name?.charAt(0) || 'U')}</div>`
                            }
                            <div>
                                <div style="font-weight:600;">${escapeHtml(otherUser?.name)}</div>
                                <div style="font-size:0.7rem; color:var(--text-muted);">Online</div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button id="sendMessageBtn" style="width:auto; padding:0.75rem 1.5rem;"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            
            document.getElementById("backToChats")?.addEventListener("click", () => {
                currentChatId = null;
                if (messageUnsubscribe) messageUnsubscribe();
                loadChats();
                document.getElementById("messagesView").innerHTML = '<div id="chatsContainer"></div><div id="chatAreaView"></div>';
            });
            
            // Load messages in real-time
            if (messageUnsubscribe) messageUnsubscribe();
            messageUnsubscribe = onSnapshot(query(messagesCol, where("chatId", "==", chatId), orderBy("createdAt", "asc")), (snapshot) => {
                const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const messagesContainer = document.getElementById("chatMessages");
                if (messagesContainer) {
                    messagesContainer.innerHTML = messages.map(msg => `
                        <div class="message ${msg.senderId === currentUserId ? 'sent' : 'received'}">
                            ${escapeHtml(msg.text)}
                            <div style="font-size:0.6rem; opacity:0.7; margin-top:0.2rem;">${getTimeAgo(msg.createdAt)}</div>
                        </div>
                    `).join('');
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
                
                // Mark messages as read
                if (messages.length > 0) {
                    const updatePromises = [];
                    for (const msg of messages) {
                        if (msg.senderId !== currentUserId && !msg.read) {
                            updatePromises.push(updateDoc(doc(messagesCol, msg.id), { read: true }));
                        }
                    }
                    Promise.all(updatePromises);
                }
            });
            
            document.getElementById("sendMessageBtn")?.addEventListener("click", async () => {
                const input = document.getElementById("messageInput");
                const text = input.value.trim();
                if (text) {
                    await addDoc(messagesCol, {
                        chatId,
                        senderId: currentUserId,
                        text,
                        read: false,
                        createdAt: Timestamp.now()
                    });
                    await updateDoc(doc(chatsCol, chatId), {
                        lastMessage: text,
                        updatedAt: Timestamp.now(),
                        [`unreadCount.${otherUserId}`]: increment(1)
                    });
                    input.value = '';
                }
            });
        }
        
        async function startChat(userId, userName) {
            // Check if chat already exists
            const existing = await getDocs(query(chatsCol, where("participants", "array-contains", currentUserId)));
            let chatId = null;
            for (const chatDoc of existing.docs) {
                const chat = chatDoc.data();
                if (chat.participants.includes(userId)) {
                    chatId = chatDoc.id;
                    break;
                }
            }
            
            if (!chatId) {
                const newChat = await addDoc(chatsCol, {
                    participants: [currentUserId, userId],
                    createdAt: Timestamp.now(),
                    updatedAt: Timestamp.now(),
                    lastMessage: "",
                    unreadCount: { [currentUserId]: 0, [userId]: 0 }
                });
                chatId = newChat.id;
            }
            
            openChat(chatId, userId);
        }

        // Load Feed
        let feedUnsubscribe = null;
        
        async function loadFeed() {
            const feedContainer = document.getElementById("feedContainer");
            if (!feedContainer) return;
            
            feedContainer.innerHTML = `<div class="loader"></div>`;
            
            if (feedUnsubscribe) feedUnsubscribe();
            
            feedUnsubscribe = onSnapshot(query(postsCol, orderBy("timestamp", "desc"), limit(30)), async (snapshot) => {
                const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const userLikes = new Set();
                const likesSnap = await getDocs(query(likesCol, where("userId", "==", currentUserId)));
                likesSnap.forEach(d => userLikes.add(d.data().postId));
                
                const commentCounts = new Map();
                for (const post of posts) {
                    const commentsSnap = await getDocs(query(commentsCol, where("postId", "==", post.id)));
                    commentCounts.set(post.id, commentsSnap.size);
                }
                
                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="card" style="text-align:center;">
                            <i class="fas fa-newspaper" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
                            <h3>No posts yet</h3>
                            <p style="color:var(--text-muted); margin-bottom:1rem;">Be the first to share something!</p>
                            <button id="emptyCreatePostBtn" class="btn-primary">Create Post</button>
                        </div>
                    `;
                    document.getElementById("emptyCreatePostBtn")?.addEventListener("click", showCreatePostModal);
                    return;
                }
                
                feedContainer.innerHTML = posts.map(post => {
                    const avatarHtml = post.authorAvatar ? 
                        `<img src="${post.authorAvatar}" class="avatar-img" onerror="this.style.display='none';this.nextSibling.style.display='flex'">` : 
                        `<div class="avatar">${escapeHtml(post.authorName?.charAt(0) || 'U')}</div>`;
                    return `
                        <div class="card" data-post-id="${post.id}">
                            <div class="post-header">
                                <div>${avatarHtml}</div>
                                <div>
                                    <div style="font-weight:700;">${escapeHtml(post.authorName || 'User')}</div>
                                    <div style="font-size:0.7rem; color:var(--text-muted);">${getTimeAgo(post.timestamp)}</div>
                                </div>
                            </div>
                            <div class="post-content">
                                <p>${escapeHtml(post.content)}</p>
                                ${post.imageUrl ? `<img src="${post.imageUrl}" style="width:100%; border-radius:0.75rem; margin-top:0.5rem;">` : ''}
                            </div>
                            <div class="post-stats">
                                <span class="like-count-${post.id}"><i class="fas fa-heart" style="color:var(--danger);"></i> ${post.likes || 0}</span>
                                <span class="comment-count-${post.id}"><i class="fas fa-comment"></i> ${commentCounts.get(post.id) || 0}</span>
                            </div>
                            <div class="post-actions">
                                <button class="like-post ${userLikes.has(post.id) ? 'liked' : ''}" data-id="${post.id}">
                                    <i class="fas fa-heart"></i> ${userLikes.has(post.id) ? 'Liked' : 'Like'}
                                </button>
                                <button class="comment-btn" data-id="${post.id}"><i class="far fa-comment"></i> Comment</button>
                                <button><i class="fas fa-share"></i> Share</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Like button handler with notification
                document.querySelectorAll('.like-post').forEach(btn => {
                    btn.onclick = async () => {
                        const postId = btn.dataset.id;
                        const postDoc = await getDoc(doc(postsCol, postId));
                        const post = postDoc.data();
                        const likeQuery = query(likesCol, where("postId", "==", postId), where("userId", "==", currentUserId));
                        const existingLike = await getDocs(likeQuery);
                        
                        if (existingLike.empty) {
                            await addDoc(likesCol, { postId, userId: currentUserId, createdAt: Timestamp.now() });
                            await updateDoc(doc(postsCol, postId), { likes: increment(1) });
                            if (post.authorId !== currentUserId) {
                                await createNotification(post.authorId, 'like', 'Someone liked your post', `${currentUserData?.name} liked your post: "${post.content.substring(0, 50)}..."`, postId);
                            }
                        } else {
                            await deleteDoc(existingLike.docs[0].ref);
                            await updateDoc(doc(postsCol, postId), { likes: increment(-1) });
                        }
                    };
                });
            });
        }

                document.querySelectorAll('.save-job').forEach(btn => {

                        const existing = await getDocs(query(applicationsCol, where("jobId", "==", btn.dataset.id), where("applicantId", "==", currentUserId)));
                        if (!existing.empty) return showToast("You already applied for this job");
                        await addDoc(applicationsCol, { jobId: btn.dataset.id, applicantId: currentUserId, status: 'applied', appliedAt: Timestamp.now() });
                        // Get job details for notification
                        const jobDoc = await getDoc(doc(jobsCol, btn.dataset.id));
                        const job = jobDoc.data();

                document.querySelectorAll('.view-job').forEach(btn => {

                            await addDoc(applicationsCol, { jobId: btn.dataset.id, applicantId: currentUserId, status: 'applied', appliedAt: Timestamp.now() });

                            showToast("Application submitted! 🎉");

                        });

        async function loadSavedJobsSet() {
            const q = query(savedJobsCol, where("userId", "==", currentUserId));
            const snap = await getDocs(q);
            savedJobsSet.clear();
            snap.forEach(d => savedJobsSet.add(d.data().jobId));
        }

        async function toggleSaveJob(jobId) {
            const ref = doc(savedJobsCol, `${currentUserId}_${jobId}`);
            if (savedJobsSet.has(jobId)) {
                await deleteDoc(ref);
                savedJobsSet.delete(jobId);
                showToast("Removed from saved jobs");
            } else {
                await setDoc(ref, { userId: currentUserId, jobId, savedAt: Timestamp.now() });
                savedJobsSet.add(jobId);
                showToast("Job saved! 💾");
            }
            loadJobs();
        }

                            `<div class="avatar" style="width:80px; height:80px; margin:0 auto 1rem; font-size:1.8rem;">${escapeHtml(userData.name?.charAt(0) || 'U')}</div>`
                        }
                        <h2 style="font-size:1.3rem;">${escapeHtml(userData.name)} ${userData.openToWork ? '<span class="open-to-work" style="background:var(--success); color:white; font-size:0.7rem; padding:2px 8px; border-radius:2rem; display:inline-block; margin-left:0.5rem;">#OpenToWork</span>' : ''}</h2>
                        <p style="color:var(--text-secondary); margin-bottom:0.5rem;">${escapeHtml(userData.title || 'Professional')}</p>
                        <p style="margin-bottom:1rem;">${escapeHtml(userData.bio || 'No bio yet. Click edit to add your professional summary.')}</p>
                        <div style="display:flex; justify-content:center; gap:1.5rem; margin-bottom:1rem;">
                            <div><strong>${followersCount}</strong><br/><span style="font-size:0.7rem;">Followers</span></div>
                            <div><strong>${followingCount}</strong><br/><span style="font-size:0.7rem;">Following</span></div>
                        </div>
                        <button id="uploadAvatarBtn" class="btn-outline" style="width:100%; margin-bottom:0.5rem;"><i class="fas fa-camera"></i> Upload Photo</button>
                        <button id="editProfileBtn" class="btn-outline" style="width:100%; margin-bottom:0.5rem;"><i class="fas fa-edit"></i> Edit Profile</button>
                        <button id="toggleOpenToWorkBtn" class="btn-outline" style="width:100%;"><i class="fas fa-briefcase"></i> ${userData.openToWork ? 'Disable #OpenToWork' : 'Enable #OpenToWork'}</button>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:0.75rem;"><i class="fas fa-briefcase"></i> My Applications (${applications.length})</h3>
                        ${applications.length > 0 ? applications.map(app => `
                            <div style="padding:0.75rem 0; border-bottom:1px solid var(--border);">
                                <div style="font-weight:600;">${escapeHtml(app.job.title)}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${escapeHtml(app.job.employerName)}</div>
                                <div style="margin-top:0.25rem;"><span class="badge" style="background:var(--success);">${app.status}</span></div>
                            </div>
                        `).join('') : '<p style="color:var(--text-muted); text-align:center; padding:1rem;">No applications yet. Start applying to jobs!</p>'}
                    </div>
                `;
                
                document.getElementById("uploadAvatarBtn")?.addEventListener("click", () => document.getElementById("avatarInput").click());
                document.getElementById("avatarInput")?.addEventListener("change", async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const storageRef = ref(storage, `avatars/${currentUserId}`);
                        await uploadBytes(storageRef, file);
                        const avatarUrl = await getDownloadURL(storageRef);
                        await updateDoc(doc(usersCol, currentUserId), { avatarUrl });
                        showToast("Profile picture updated!");
                        loadProfile();
                    }
                });
                
                document.getElementById("editProfileBtn")?.addEventListener("click", () => {
                    const bio = prompt("Enter your bio:", userData.bio || "");
                    const title = prompt("Enter your title (e.g., Software Engineer):", userData.title || "");
                    if (bio !== null) updateDoc(doc(usersCol, currentUserId), { bio });
                    if (title !== null) updateDoc(doc(usersCol, currentUserId), { title });
                    if (bio !== null || title !== null) {
                        showToast("Profile updated!");
                        loadProfile();
                    }
                });
                
                document.getElementById("toggleOpenToWorkBtn")?.addEventListener("click", async () => {
                    await updateDoc(doc(usersCol, currentUserId), { openToWork: !userData.openToWork });
                    showToast(userData.openToWork ? "#OpenToWork disabled" : "#OpenToWork enabled!");
                    loadProfile();
                });
            } catch (error) {
                console.error("Profile error:", error);
                profileContainer.innerHTML = `<div class="card" style="text-align:center;">Failed to load profile</div>`;
            }
        }

        // Create Post Modal
        function showCreatePostModal() {
            const modal = document.createElement("div");
            modal.className = "modal active";
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:1rem;">Create Post</h3>
                    <textarea id="postContent" placeholder="What's on your mind? Share updates, celebrate wins, or ask questions..." rows="5" style="width:100%; padding:0.875rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary); margin-bottom:1rem;"></textarea>
                    <div style="margin-bottom:1rem;">
                        <button id="addImageBtn" style="width:auto; padding:0.5rem 1rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:0.5rem; cursor:pointer;"><i class="fas fa-image"></i> Add Image</button>
                        <input type="file" id="postImageInput" accept="image/*" style="display:none;">
                    </div>
                    <button id="submitPost" class="btn-primary">Post</button>
                    <button class="close-modal" style="margin-top:0.75rem; background:transparent; border:1px solid var(--border); width:100%; padding:0.875rem; border-radius:0.75rem; cursor:pointer;">Cancel</button>
                </div>
            `;
            
            let imageUrl = null;
            
            document.getElementById("addImageBtn")?.addEventListener("click", () => document.getElementById("postImageInput").click());
            document.getElementById("postImageInput")?.addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const storageRef = ref(storage, `posts/${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                    showToast("Image uploaded!");
                }
            });
            
            document.body.appendChild(modal);
            modal.querySelector("#submitPost")?.addEventListener("click", async () => {
                const content = modal.querySelector("#postContent").value;
                if (content.trim()) {
                    await addDoc(postsCol, {
                        content,
                        authorId: currentUserId,
                        authorName: currentUserData?.name,
                        authorAvatar: currentUserData?.avatarUrl || "",
                        imageUrl: imageUrl,
                        timestamp: Timestamp.now(),
                        likes: 0,
                        comments: 0
                    });
                    showToast("Post created! 🎉");
                    modal.remove();
                } else {
                    showToast("Please write something first");
                }
            });
            modal.querySelector(".close-modal")?.addEventListener("click", () => modal.remove());
        }

        // Main App
        async function renderMainApp() {
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            currentUserData = userDoc.data();
            await loadUnreadCount();
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink</div>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button onclick="window.toggleTheme()" style="background:var(--bg-secondary); border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; color:var(--text-primary);"><i class="fas fa-moon"></i></button>
                        <div class="notification-badge">
                            <button id="notificationsNavBtn" style="background:none; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; color:var(--text-primary);"><i class="fas fa-bell"></i></button>
                            <span id="notificationBadge" class="badge-count" style="display:none;">0</span>
                        </div>
                        <button class="logout-btn" style="background:var(--danger); border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white; cursor:pointer; font-weight:500;">Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button data-nav="feed"><i class="fas fa-home"></i><span>Feed</span></button>
                    <button data-nav="jobs"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="network"><i class="fas fa-users"></i><span>Network</span></button>
                    <button data-nav="messages"><i class="fas fa-comment"></i><span>Chat</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                </div>
                <div class="container">
                    <div id="feedView" class="view"><div id="feedContainer"></div><div class="card" style="text-align:center;"><button id="createPostBtn" class="btn-primary"><i class="fas fa-plus"></i> Create Post</button></div></div>
                    <div id="jobsView" class="view"><div id="jobsContainer"></div></div>
                    <div id="networkView" class="view"><div id="networkContainer"></div></div>
                    <div id="messagesView" class="view"><div id="chatsContainer"></div><div id="chatAreaView"></div></div>
                    <div id="notificationsView" class="view"><div id="notificationsContainer"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                </div>
            `;
            
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            document.getElementById("notificationsNavBtn")?.addEventListener("click", () => navigateTo('notifications'));
            document.querySelector(".logout-btn")?.addEventListener("click", () => signOut(auth));
            document.getElementById("createPostBtn")?.addEventListener("click", showCreatePostModal);
            
            // Job search
            const searchContainer = document.getElementById("searchContainer");
            if (searchContainer) {
                searchContainer.innerHTML = `
                    <div class="search-section">
                        <input type="text" id="jobSearchInput" class="search-input" placeholder="🔍 Search jobs by title, company, or location...">
                    </div>
                `;
                document.getElementById("jobSearchInput")?.addEventListener("input", (e) => {
                    searchKeyword = e.target.value;
                    loadJobs();
                });
            }
            
            // Real-time notification listener
            if (notificationsUnsubscribe) notificationsUnsubscribe();
            notificationsUnsubscribe = onSnapshot(query(notificationsCol, where("userId", "==", currentUserId), where("read", "==", false)), (snapshot) => {
                unreadCount = snapshot.size;
                updateNotificationBadge();
            });
            
            await loadFeed();
            await loadJobs();
            await loadNetwork();
            await loadChats();
            await loadProfile();
            navigateTo('feed');
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            renderMainApp();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserId = user.uid;
                const userDoc = await getDoc(doc(usersCol, user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(usersCol, user.uid), {
                        name: user.email.split('@')[0],
                        email: user.email,
                        role: "Job Seeker",
                        createdAt: Timestamp.now(),
                        verified: false,
                        bio: "",
                        title: "",
                        skills: [],
                        avatarUrl: "",
                        openToWork: false
                    });
                }
                renderDashboard();
            } else {
                currentUser = null;
                if (feedUnsubscribe) feedUnsubscribe();
                if (notificationsUnsubscribe) notificationsUnsubscribe();
                if (messageUnsubscribe) messageUnsubscribe();
                renderAuthScreen();
            }
        });
    </script>
</body>
</html>
