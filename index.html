<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <title>JobLink – Africa's Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border: #2a2a35;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --transition: all 0.2s ease;
        }
        body.light {
            --bg-primary: #f5f7fb;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: var(--transition); padding-bottom: 70px; }
        
        /* Navbar */
        .navbar {
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 0.5rem; }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 0.75rem;
        }
        .bottom-nav button i { font-size: 22px; }
        .bottom-nav button.active { color: var(--accent); background: var(--bg-primary); }
        
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; padding-bottom: 80px; }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: var(--transition);
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        /* Post Card */
        .post-header { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
        .avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
        }
        .post-content p { margin-bottom: 0.75rem; line-height: 1.5; }
        .post-image { width: 100%; border-radius: 0.75rem; margin-top: 0.5rem; max-height: 300px; object-fit: cover; }
        .post-stats { display: flex; gap: 1rem; padding: 0.5rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 0.75rem; color: var(--text-secondary); }
        .post-actions { display: flex; gap: 1rem; padding-top: 0.5rem; }
        .post-actions button { flex: 1; background: none; border: none; padding: 0.5rem; border-radius: 0.5rem; color: var(--text-secondary); cursor: pointer; }
        .post-actions button:hover { background: var(--bg-primary); color: var(--accent); }
        
        /* Job Card */
        .job-header { display: flex; gap: 1rem; margin-bottom: 0.75rem; }
        .job-logo { width: 56px; height: 56px; background: var(--bg-primary); border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .job-title h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .company-name { font-size: 0.8rem; color: var(--accent); font-weight: 500; }
        .job-details { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.7rem; color: var(--text-secondary); margin: 0.5rem 0; }
        .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0.6rem; border-radius: 0.5rem; font-size: 0.7rem; font-weight: 500; }
        .badge-featured { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #0c0a2a; }
        .badge-remote { background: #10b981; color: white; }
        .badge-verified { background: var(--accent); color: white; }
        
        /* Job Status Tracking */
        .application-status {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }
        .status-step {
            flex: 1;
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            position: relative;
        }
        .status-step.active { color: var(--accent); }
        .status-step.completed { color: #10b981; }
        
        /* Profile */
        .profile-cover { height: 100px; background: var(--accent-gradient); border-radius: 1rem 1rem 0 0; }
        .profile-info { text-align: center; margin-top: -40px; padding: 0 1rem 1rem; }
        .profile-avatar { width: 80px; height: 80px; background: var(--accent-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; margin: 0 auto 0.75rem; border: 4px solid var(--bg-card); }
        .profile-stats { display: flex; justify-content: center; gap: 2rem; padding: 1rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 1rem 0; }
        
        /* Skills Section */
        .skills-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .skill-tag { background: var(--bg-primary); padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.75rem; }
        
        /* Chat */
        .chat-container { display: flex; flex-direction: column; height: 70vh; background: var(--bg-card); border-radius: 1rem; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .message { max-width: 80%; padding: 0.6rem 1rem; border-radius: 1rem; font-size: 0.85rem; }
        .message.sent { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 0.25rem; }
        .message.received { background: var(--bg-primary); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 0.25rem; }
        .chat-input { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); }
        .chat-input input { flex: 1; padding: 0.75rem; border: 1px solid var(--border); border-radius: 2rem; background: var(--bg-primary); color: var(--text-primary); }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* Skeleton Loader */
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--bg-primary) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.5rem; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { padding: 1rem; }
        .skeleton-line { height: 12px; margin-bottom: 0.5rem; border-radius: 0.5rem; }
        
        /* Buttons */
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 2rem;
            z-index: 2000;
            font-size: 0.85rem;
        }
        
        @media (max-width: 768px) {
            .navbar .nav-links { display: none; }
            .container { padding: 0.75rem; padding-bottom: 80px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter, Timestamp, addDoc, onSnapshot, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92",
            measurementId: "G-WHHYBSKV93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Collections
        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const postsCol = collection(db, "posts");
        const applicationsCol = collection(db, "applications");
        const savedJobsCol = collection(db, "savedJobs");
        const followsCol = collection(db, "follows");
        const messagesCol = collection(db, "messages");
        const chatRoomsCol = collection(db, "chatRooms");

        let currentUser = null, userRole = null, currentUserId = null;
        let currentUserData = null;
        let allJobsCache = [];
        let postsUnsubscribe = null;
        let jobsUnsubscribe = null;
        let currentChatRoom = null;

        function showToast(msg, type = "info") {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }
        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            const now = new Date();
            const diff = Math.floor((now - date) / (1000 * 60));
            if (diff < 1) return 'Just now';
            if (diff < 60) return `${diff}m ago`;
            if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
            return `${Math.floor(diff / 1440)}d ago`;
        }
        function isBoostActive(job) { return job.boosted || false; }

        // Theme
        function initTheme() { const saved = localStorage.getItem('theme'); if (saved === 'light') document.body.classList.add('light'); }
        window.toggleTheme = () => { document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark'); };
        initTheme();

        // Navigation
        function navigateTo(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                if (btn.dataset.nav === view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (view === 'feed') loadFeed();
            if (view === 'jobs') loadJobs();
            if (view === 'profile') loadProfile();
        }

        // Render Auth Screen
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem;">
                    <div style="background:var(--bg-card); border-radius:1.5rem; max-width:460px; width:100%; padding:2rem;">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="font-size:3rem; background:var(--accent-gradient); width:80px; height:80px; display:inline-flex; align-items:center; justify-content:center; border-radius:1.5rem; margin-bottom:1rem;">
                                <i class="fas fa-briefcase" style="color:white; font-size:2rem;"></i>
                            </div>
                            <h1 style="font-size:2rem; font-weight:800;">JobLink</h1>
                            <p style="color:var(--text-secondary);">Africa's Professional Network</p>
                        </div>
                        <div style="display:flex; gap:0.75rem; background:var(--bg-primary); border-radius:1rem; padding:0.25rem; margin-bottom:2rem;">
                            <button class="tab-btn active" data-tab="login" style="flex:1; background:var(--bg-card); border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Sign in</button>
                            <button class="tab-btn" data-tab="signup" style="flex:1; background:transparent; border:none; padding:0.7rem; border-radius:0.75rem; cursor:pointer; font-weight:600;">Create account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="password" id="loginPassword" placeholder="Password" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <button id="doLogin" style="width:100%; padding:0.8rem; border-radius:0.75rem; background:var(--accent-gradient); color:white; font-weight:600; border:none;">Sign in →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" placeholder="Full name" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="email" id="signupEmail" placeholder="Email" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <input type="password" id="signupPassword" placeholder="Password" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                            <select id="signupRole" style="width:100%; padding:0.8rem; border-radius:0.75rem; border:1px solid var(--border); background:var(--bg-primary); margin-bottom:1rem;">
                                <option>Job Seeker</option><option>Employer</option><option>Admin</option>
                            </select>
                            <button id="doSignup" style="width:100%; padding:0.8rem; border-radius:0.75rem; background:var(--accent-gradient); color:white; font-weight:600; border:none;">Create account</button>
                        </div>
                    </div>
                </div>
            `;
            
            const loginPanel = document.getElementById("loginPanel"), signupPanel = document.getElementById("signupPanel");
            const loginTab = document.querySelector('[data-tab="login"]'), signupTab = document.querySelector('[data-tab="signup"]');
            loginTab.onclick = () => { loginPanel.style.display = "block"; signupPanel.style.display = "none"; loginTab.style.background = "var(--bg-card)"; signupTab.style.background = "transparent"; };
            signupTab.onclick = () => { loginPanel.style.display = "none"; signupPanel.style.display = "block"; signupTab.style.background = "var(--bg-card)"; loginTab.style.background = "transparent"; };
            
            document.getElementById("doLogin").onclick = async () => {
                try { await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); showToast("Welcome back!"); } catch(e) { showToast(e.message); }
            };
            document.getElementById("doSignup").onclick = async () => {
                const name = document.getElementById("signupName").value, email = document.getElementById("signupEmail").value, pwd = document.getElementById("signupPassword").value, role = document.getElementById("signupRole").value;
                if (!name || !email || !pwd) return showToast("All fields required");
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await setDoc(doc(usersCol, cred.user.uid), { name, email, role, createdAt: Timestamp.now(), followers: 0, following: 0, skills: [], bio: "", title: "" });
                    showToast("Account created!");
                } catch(e) { showToast(e.message); }
            };
        }

        // Load Feed with Real-time
        async function loadFeed() {
            const feedContainer = document.getElementById("feedContainer");
            if (!feedContainer) return;
            
            feedContainer.innerHTML = `<div class="skeleton-card"><div class="skeleton-line" style="height:60px;"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:70%;"></div></div>`;
            
            if (postsUnsubscribe) postsUnsubscribe();
            postsUnsubscribe = onSnapshot(query(postsCol, orderBy("timestamp", "desc"), limit(20)), (snapshot) => {
                const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                feedContainer.innerHTML = posts.map(post => `
                    <div class="card">
                        <div class="post-header">
                            <div class="avatar">${escapeHtml(post.authorName?.charAt(0) || 'U')}</div>
                            <div>
                                <div style="font-weight:700;">${escapeHtml(post.authorName || 'User')}</div>
                                <div style="font-size:0.7rem; color:var(--text-secondary);">${getTimeAgo(post.timestamp)}</div>
                            </div>
                        </div>
                        <div class="post-content">
                            <p>${escapeHtml(post.content)}</p>
                            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image">` : ''}
                        </div>
                        <div class="post-stats">
                            <span><i class="fas fa-heart"></i> ${post.likes || 0}</span>
                            <span><i class="fas fa-comment"></i> ${post.comments || 0}</span>
                        </div>
                        <div class="post-actions">
                            <button class="like-post" data-id="${post.id}"><i class="far fa-heart"></i> Like</button>
                            <button><i class="far fa-comment"></i> Comment</button>
                        </div>
                    </div>
                `).join('');
            });
        }

        // Load Jobs with Pagination
        let lastJobDoc = null;
        let isLoadingJobs = false;
        
        async function loadJobs(loadMore = false) {
            const jobsContainer = document.getElementById("jobsContainer");
            if (!jobsContainer) return;
            
            if (!loadMore) {
                jobsContainer.innerHTML = `<div class="skeleton-card"><div class="skeleton-line" style="height:80px;"></div></div>`;
                lastJobDoc = null;
                allJobsCache = [];
            }
            
            if (isLoadingJobs) return;
            isLoadingJobs = true;
            
            let q = query(jobsCol, orderBy("timestamp", "desc"), limit(10));
            if (lastJobDoc) q = query(jobsCol, orderBy("timestamp", "desc"), startAfter(lastJobDoc), limit(10));
            
            const snapshot = await getDocs(q);
            lastJobDoc = snapshot.docs[snapshot.docs.length - 1];
            const newJobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            allJobsCache = [...allJobsCache, ...newJobs];
            
            jobsContainer.innerHTML = allJobsCache.map(job => `
                <div class="card">
                    <div class="job-header">
                        <div class="job-logo"><i class="fas fa-building"></i></div>
                        <div class="job-title">
                            <h3>${escapeHtml(job.title)}</h3>
                            <div class="company-name">${escapeHtml(job.employerName)}</div>
                            <div class="job-details">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Negotiable')}</span>
                                <span><i class="fas fa-clock"></i> ${getTimeAgo(job.timestamp)}</span>
                            </div>
                            <div>
                                ${isBoostActive(job) ? '<span class="badge badge-featured"><i class="fas fa-rocket"></i> Featured</span>' : ''}
                                ${job.location?.toLowerCase().includes('remote') ? '<span class="badge badge-remote"><i class="fas fa-globe"></i> Remote</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="application-status">
                        <div class="status-step">📝 Applied</div>
                        <div class="status-step">👁️ Viewed</div>
                        <div class="status-step">⭐ Shortlisted</div>
                        <div class="status-step">🎉 Hired</div>
                    </div>
                    <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
                        <button class="apply-job" data-id="${job.id}" style="flex:1; background:var(--accent-gradient); border:none; padding:0.6rem; border-radius:0.5rem; color:white; cursor:pointer;">Apply Now</button>
                        <button class="save-job" data-id="${job.id}" style="background:var(--bg-primary); border:none; padding:0.6rem 1rem; border-radius:0.5rem; cursor:pointer;"><i class="far fa-bookmark"></i></button>
                    </div>
                </div>
            `).join('');
            
            if (snapshot.docs.length === 10) {
                jobsContainer.innerHTML += `<button id="loadMoreJobs" class="btn-outline" style="width:100%; margin-top:1rem;">Load More Jobs</button>`;
                document.getElementById("loadMoreJobs")?.addEventListener("click", () => loadJobs(true));
            }
            isLoadingJobs = false;
        }

        // Load Profile
        async function loadProfile() {
            const profileContainer = document.getElementById("profileContainer");
            if (!profileContainer) return;
            
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            const userData = userDoc.data();
            
            profileContainer.innerHTML = `
                <div class="card" style="padding:0; overflow:hidden;">
                    <div class="profile-cover"></div>
                    <div class="profile-info">
                        <div class="profile-avatar">${escapeHtml(userData.name?.charAt(0) || 'U')}</div>
                        <div class="profile-name" style="font-size:1.3rem; font-weight:700;">${escapeHtml(userData.name)}</div>
                        <div class="profile-title" style="color:var(--text-secondary);">${escapeHtml(userData.title || 'Professional')}</div>
                        <div class="profile-stats">
                            <div><strong>45</strong><br/><span style="font-size:0.7rem;">Posts</span></div>
                            <div><strong>${userData.followers || 0}</strong><br/><span style="font-size:0.7rem;">Followers</span></div>
                            <div><strong>${userData.following || 0}</strong><br/><span style="font-size:0.7rem;">Following</span></div>
                        </div>
                        <p style="margin:0.5rem 0;">${escapeHtml(userData.bio || 'No bio yet. Click edit to add your professional summary.')}</p>
                        <button id="editProfileBtn" class="btn-outline" style="width:100%;">Edit Profile</button>
                    </div>
                </div>
                <div class="card">
                    <h4><i class="fas fa-code"></i> Skills</h4>
                    <div class="skills-list">
                        ${(userData.skills || ['JavaScript', 'React', 'Firebase']).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}
                        <button class="skill-tag" id="addSkillBtn" style="background:var(--accent); color:white;">+ Add</button>
                    </div>
                </div>
                <div class="card">
                    <h4><i class="fas fa-briefcase"></i> Experience</h4>
                    <p style="color:var(--text-secondary); padding:0.5rem 0;">No experience added yet</p>
                    <button class="btn-outline" style="width:100%;">+ Add Experience</button>
                </div>
            `;
            
            document.getElementById("editProfileBtn")?.addEventListener("click", () => {
                const newBio = prompt("Enter your bio:", userData.bio || "");
                if (newBio !== null) updateDoc(doc(usersCol, currentUserId), { bio: newBio });
            });
        }

        // Render Main App
        async function renderMainApp() {
            const userDoc = await getDoc(doc(usersCol, currentUserId));
            currentUserData = userDoc.data();
            
            document.getElementById("app").innerHTML = `
                <nav class="navbar">
                    <div class="logo"><i class="fas fa-briefcase"></i> JobLink</div>
                    <div style="display:flex; gap:0.5rem;">
                        <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--text-primary); cursor:pointer;"><i class="fas fa-moon"></i></button>
                        <button class="logout-btn" style="background:#ef4444; border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white; cursor:pointer;">Logout</button>
                    </div>
                </nav>
                <div class="bottom-nav">
                    <button data-nav="feed" class="active"><i class="fas fa-home"></i><span>Feed</span></button>
                    <button data-nav="jobs"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                    <button data-nav="chat"><i class="fas fa-comment"></i><span>Chat</span></button>
                </div>
                <div class="container">
                    <div id="feedView" class="view active"><div id="feedContainer"></div><div class="card" style="text-align:center;"><button id="createPostBtn" class="btn-primary"><i class="fas fa-plus"></i> Create Post</button></div></div>
                    <div id="jobsView" class="view"><div id="jobsContainer"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                    <div id="chatView" class="view"><div id="chatContainer" style="text-align:center; padding:2rem;"><p>Select a conversation to start chatting</p></div></div>
                </div>
            `;
            
            // Navigation
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.nav);
            });
            document.querySelector(".logout-btn")?.addEventListener("click", () => signOut(auth));
            
            // Create Post Modal
            document.getElementById("createPostBtn")?.addEventListener("click", () => {
                const content = prompt("What's on your mind?", "");
                if (content) {
                    addDoc(postsCol, {
                        content,
                        authorId: currentUserId,
                        authorName: currentUserData?.name || currentUser.email,
                        timestamp: Timestamp.now(),
                        likes: 0,
                        comments: 0
                    }).then(() => showToast("Post created!"));
                }
            });
            
            // Load initial data
            loadFeed();
            loadJobs();
            loadProfile();
        }

        function renderDashboard() {
            if (!currentUser) return renderAuthScreen();
            renderMainApp();
        }

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserId = user.uid;
                const userDoc = await getDoc(doc(usersCol, user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(usersCol, user.uid), {
                        name: user.email.split('@')[0],
                        email: user.email,
                        role: "Job Seeker",
                        createdAt: Timestamp.now(),
                        followers: 0,
                        following: 0,
                        skills: [],
                        bio: ""
                    });
                }
                renderDashboard();
            } else {
                currentUser = null;
                renderAuthScreen();
            }
        });
    </script>
</body>
</html>
