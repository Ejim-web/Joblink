<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JobLink – Africa's Professional Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --gradient: linear-gradient(135deg, #2563eb, #7c3aed);
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
        }
        body.dark {
            --light: #0f172a;
            --white: #1e293b;
            --dark: #f8fafc;
            --gray: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--dark);
            padding-bottom: 70px;
            transition: background 0.2s, color 0.2s;
        }
        .navbar {
            background: var(--white);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.4rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 500px; background: var(--white);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 10px 16px; border-radius: 60px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border); z-index: 100;
        }
        .bottom-nav button {
            background: none; border: none; display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-size: 11px; font-weight: 500;
            color: var(--gray); cursor: pointer; padding: 8px 16px;
            border-radius: 40px; transition: all 0.2s;
        }
        .bottom-nav button i { font-size: 20px; }
        .bottom-nav button.active { background: var(--gradient); color: white; }
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; padding-bottom: 80px; }
        .card {
            background: var(--white); border-radius: 1.25rem; padding: 1.25rem;
            margin-bottom: 1rem; border: 1px solid var(--border); box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--light) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.5rem; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { height: 150px; margin-bottom: 1rem; border-radius: 1rem; }
        .search-input { width: 100%; padding: 0.9rem 1rem; border: 1.5px solid var(--border); border-radius: 2rem; background: var(--white); color: var(--dark); }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 0.75rem 1.5rem; border-radius: 2rem; z-index: 2000; animation: slideUp 0.3s ease; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; display: none; }
        .modal.active { display: flex; }
        .modal-content { background: var(--white); border-radius: 1.5rem; padding: 1.5rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .loader { width: 40px; height: 40px; border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto; }
        .empty-state { text-align: center; padding: 3rem; color: var(--gray); }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .btn-primary { background: var(--gradient); color: white; border: none; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        input, select, textarea { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1.5px solid var(--border); border-radius: 0.75rem; background: var(--white); color: var(--dark); }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @media (max-width: 640px) { .container { padding: 0.75rem; } .bottom-nav { padding: 8px 12px; } .bottom-nav button { padding: 6px 12px; font-size: 10px; } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter, Timestamp, addDoc, onSnapshot, increment, writeBatch, enableIndexedDbPersistence, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config (replace with your own)
        const firebaseConfig = {
            apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
            authDomain: "joblink-d3d17.firebaseapp.com",
            projectId: "joblink-d3d17",
            storageBucket: "joblink-d3d17.appspot.com",
            messagingSenderId: "462684482263",
            appId: "1:462684482263:web:981dcbe334850ca3fe5e92"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        enableIndexedDbPersistence(db).catch(()=>console.warn("offline persistence disabled"));

        // Collections
        const usersCol = collection(db, "users");
        const jobsCol = collection(db, "jobs");
        const postsCol = collection(db, "posts");
        const applicationsCol = collection(db, "applications");
        const savedJobsCol = collection(db, "savedJobs");
        const likesCol = collection(db, "likes");
        const commentsCol = collection(db, "comments");
        const chatsCol = collection(db, "chats");
        const messagesCol = collection(db, "messages");
        const notificationsCol = collection(db, "notifications");

        // Global state
        let currentUser = null, currentUserData = null;
        let savedJobsSet = new Set();
        let searchKeyword = "", currentFilter = "all";
        let lastPostDoc = null, isLoadingPosts = false, hasMorePosts = true;
        let lastJobDoc = null, isLoadingJobs = false, hasMoreJobs = true;
        let searchTimeout = null;
        let currentView = "jobs";
        let userLikesCache = new Set();
        let activeUnsubscribers = [];

        function showToast(msg, isErr=false) { const t=document.createElement("div"); t.className="toast"; t.innerText=msg; if(isErr) t.style.background="var(--danger)"; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m)); }
        function getTimeAgo(ts) { if(!ts) return 'Just now'; const d=ts.toDate(); const diff=Math.floor((Date.now()-d)/60000); if(diff<1) return 'Just now'; if(diff<60) return `${diff}m ago`; if(diff<1440) return `${Math.floor(diff/60)}h ago`; return `${Math.floor(diff/1440)}d ago`; }
        async function getUserData(uid) { try{ const snap=await getDoc(doc(usersCol,uid)); return snap.exists()?snap.data():null; }catch(e){return null;} }
        async function createNotification(userId, type, title, message, relatedId=null) { if(userId===currentUser?.uid) return; try{ await addDoc(notificationsCol,{userId,type,title,message,relatedId,read:false,createdAt:Timestamp.now()}); }catch(e){} }

        function initTheme() { if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark'); }
        window.toggleTheme = () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light'); };
        initTheme();

        function cleanupListeners() { activeUnsubscribers.forEach(fn=>fn?.()); activeUnsubscribers=[]; }

        function navigateTo(view) {
            if(currentView===view) return;
            currentView=view;
            document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
            document.getElementById(`${view}View`)?.classList.add('active');
            document.querySelectorAll('.bottom-nav button').forEach(btn=>{
                if(btn.dataset.nav===view) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if(view==='feed') loadFeed();
            if(view==='jobs') loadJobs();
            if(view==='messages') loadChats();
            if(view==='profile') loadProfile();
            if(view==='notifications') loadNotifications();
        }

        // Auth screen
        function renderAuthScreen() {
            document.getElementById("app").innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem; background:linear-gradient(135deg,#667eea,#764ba2);">
                    <div style="background:var(--white); border-radius:2rem; max-width:460px; width:100%; padding:2rem;">
                        <div style="text-align:center; margin-bottom:2rem;">
                            <div style="width:70px; height:70px; background:var(--gradient); border-radius:1.5rem; display:inline-flex; align-items:center; justify-content:center; font-size:2rem; margin-bottom:1rem;">💼</div>
                            <div style="font-size:1.8rem; font-weight:800; background:var(--gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">JobLink</div>
                            <div style="color:var(--gray);">Africa's Professional Network</div>
                        </div>
                        <div style="display:flex; gap:1rem; background:var(--light); border-radius:1rem; padding:0.5rem; margin-bottom:2rem;">
                            <button id="loginTab" style="flex:1; padding:0.8rem; background:var(--gradient); color:white; border:none; border-radius:0.75rem;">Sign In</button>
                            <button id="signupTab" style="flex:1; padding:0.8rem; background:transparent; border:1px solid var(--border); color:var(--gray); border-radius:0.75rem;">Create Account</button>
                        </div>
                        <div id="loginPanel">
                            <input type="email" id="loginEmail" placeholder="Email">
                            <input type="password" id="loginPassword" placeholder="Password">
                            <button id="doLogin" class="btn-primary">Sign In →</button>
                        </div>
                        <div id="signupPanel" style="display:none;">
                            <input type="text" id="signupName" placeholder="Full name">
                            <input type="email" id="signupEmail" placeholder="Email">
                            <input type="password" id="signupPassword" placeholder="Password">
                            <select id="signupRole"><option>Job Seeker</option><option>Employer</option></select>
                            <button id="doSignup" class="btn-primary">Get Started →</button>
                        </div>
                    </div>
                </div>
            `;
            const loginP=document.getElementById("loginPanel"), signupP=document.getElementById("signupPanel");
            const loginTab=document.getElementById("loginTab"), signupTab=document.getElementById("signupTab");
            loginTab.onclick=()=>{ loginP.style.display="block"; signupP.style.display="none"; loginTab.style.background="var(--gradient)"; loginTab.style.color="white"; signupTab.style.background="transparent"; signupTab.style.color="var(--gray)"; };
            signupTab.onclick=()=>{ loginP.style.display="none"; signupP.style.display="block"; signupTab.style.background="var(--gradient)"; signupTab.style.color="white"; loginTab.style.background="transparent"; loginTab.style.color="var(--gray)"; };
            document.getElementById("doLogin").onclick=async()=>{
                const btn=document.getElementById("doLogin"); btn.disabled=true; btn.textContent="Signing...";
                try{ await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); }
                catch(e){ showToast(e.message,true); }
                btn.disabled=false; btn.textContent="Sign In →";
            };
            document.getElementById("doSignup").onclick=async()=>{
                const name=document.getElementById("signupName").value, email=document.getElementById("signupEmail").value, pwd=document.getElementById("signupPassword").value, role=document.getElementById("signupRole").value;
                if(!name||!email||!pwd) return showToast("All fields required",true);
                const btn=document.getElementById("doSignup"); btn.disabled=true; btn.textContent="Creating...";
                try{
                    const cred=await createUserWithEmailAndPassword(auth,email,pwd);
                    await setDoc(doc(usersCol,cred.user.uid),{ name,email,role, createdAt:Timestamp.now(), bio:"", title:"", skills:[], avatarUrl:"" });
                    showToast("Account created! 🎉");
                }catch(e){ showToast(e.message,true); }
                btn.disabled=false; btn.textContent="Get Started →";
            };
        }

        async function refreshLikesCache() {
            userLikesCache.clear();
            try{
                const snap=await getDocs(query(likesCol, where("userId","==",currentUser.uid)));
                snap.forEach(d=>userLikesCache.add(d.data().postId));
            }catch(e){}
        }

        // Feed (pagination, likes, comments)
        async function loadFeed(reset=true){
            const container=document.getElementById("feedContainer");
            if(!container) return;
            if(reset){ container.innerHTML=`<div class="skeleton-card skeleton"></div><div class="skeleton-card skeleton"></div>`; lastPostDoc=null; hasMorePosts=true; }
            if(isLoadingPosts||!hasMorePosts) return;
            isLoadingPosts=true;
            try{
                let q=query(postsCol, orderBy("timestamp","desc"), limit(10));
                if(lastPostDoc) q=query(postsCol, orderBy("timestamp","desc"), startAfter(lastPostDoc), limit(10));
                const snap=await getDocs(q);
                if(snap.empty && reset){ container.innerHTML=`<div class="empty-state"><i class="fas fa-newspaper"></i><p>No posts yet. Be the first!</p></div>`; isLoadingPosts=false; return; }
                lastPostDoc=snap.docs[snap.docs.length-1];
                hasMorePosts=snap.docs.length===10;
                const posts=snap.docs.map(d=>({id:d.id,...d.data()}));
                const html=posts.map(p=>`
                    <div class="card">
                        <div style="display:flex; gap:0.75rem; margin-bottom:1rem;">
                            <div style="width:48px; height:48px; background:var(--gradient); border-radius:50%; display:flex; align-items:center; justify-content:center;">${escapeHtml(p.authorName?.charAt(0)||'U')}</div>
                            <div><div style="font-weight:700;">${escapeHtml(p.authorName)}</div><div style="font-size:0.7rem; color:var(--gray);">${getTimeAgo(p.timestamp)}</div></div>
                        </div>
                        <div><p>${escapeHtml(p.content)}</p>${p.imageUrl?`<img src="${p.imageUrl}" style="width:100%; border-radius:1rem; margin-top:0.75rem;">`:''}</div>
                        <div style="display:flex; gap:1rem; padding:0.75rem 0; margin-top:0.5rem;"><span><i class="fas fa-heart"></i> ${p.likesCount||0}</span><span><i class="fas fa-comment"></i> ${p.commentsCount||0}</span></div>
                        <div style="display:flex; gap:1rem; padding-top:0.5rem;">
                            <button class="like-post" data-id="${p.id}" style="flex:1; background:none; border:none; padding:0.5rem; border-radius:0.5rem; cursor:pointer;"><i class="fas fa-heart"></i> ${userLikesCache.has(p.id)?'Liked':'Like'}</button>
                            <button class="comment-post" data-id="${p.id}" style="flex:1; background:none; border:none; padding:0.5rem; border-radius:0.5rem; cursor:pointer;"><i class="far fa-comment"></i> Comment</button>
                        </div>
                        <div id="comments-${p.id}" style="display:none; margin-top:1rem;"></div>
                    </div>
                `).join('');
                container.innerHTML=reset?html:container.innerHTML+html;
                if(hasMorePosts&&!reset){
                    const btn=document.createElement("button"); btn.textContent="Load More"; btn.className="btn-primary"; btn.style.width="auto"; btn.style.padding="0.5rem 1rem"; btn.onclick=()=>loadFeed(false);
                    container.appendChild(btn);
                }
            }catch(e){ console.error(e); showToast("Failed to load feed",true); }
            isLoadingPosts=false;
        }

        // Jobs system
        async function loadSavedJobsSet() { try{ const snap=await getDocs(query(savedJobsCol, where("userId","==",currentUser.uid))); savedJobsSet.clear(); snap.forEach(d=>savedJobsSet.add(d.data().jobId)); }catch(e){} }
        async function toggleSaveJob(jobId){ const ref=doc(savedJobsCol,`${currentUser.uid}_${jobId}`); try{ if(savedJobsSet.has(jobId)){ await deleteDoc(ref); savedJobsSet.delete(jobId); showToast("Removed"); }else{ await setDoc(ref,{userId:currentUser.uid,jobId,savedAt:Timestamp.now()}); savedJobsSet.add(jobId); showToast("Saved!"); } loadJobs(); }catch(e){ showToast("Error",true); } }

        async function loadJobs(reset=true){
            const container=document.getElementById("jobsContainer");
            if(!container) return;
            if(reset){ container.innerHTML=`<div class="skeleton-card skeleton"></div><div class="skeleton-card skeleton"></div>`; lastJobDoc=null; hasMoreJobs=true; }
            if(isLoadingJobs||!hasMoreJobs) return;
            isLoadingJobs=true;
            try{
                let q=query(jobsCol, orderBy("timestamp","desc"), limit(10));
                if(lastJobDoc) q=query(jobsCol, orderBy("timestamp","desc"), startAfter(lastJobDoc), limit(10));
                const snap=await getDocs(q);
                if(snap.empty && reset){ container.innerHTML=`<div class="empty-state"><i class="fas fa-briefcase"></i><p>No jobs yet</p></div>`; isLoadingJobs=false; return; }
                lastJobDoc=snap.docs[snap.docs.length-1];
                hasMoreJobs=snap.docs.length===10;
                let jobs=snap.docs.map(d=>({id:d.id,...d.data()}));
                if(searchKeyword) jobs=jobs.filter(j=>j.title?.toLowerCase().includes(searchKeyword.toLowerCase())||j.employerName?.toLowerCase().includes(searchKeyword.toLowerCase()));
                if(currentFilter==='remote') jobs=jobs.filter(j=>j.location?.toLowerCase().includes('remote'));
                const html=jobs.map(job=>`
                    <div class="card">
                        <div style="display:flex; gap:1rem;"><div style="width:56px; height:56px; background:var(--gradient); border-radius:1rem; display:flex; align-items:center; justify-content:center;"><i class="fas fa-building"></i></div>
                        <div style="flex:1;"><div style="font-weight:700;">${escapeHtml(job.title)}</div><div style="color:var(--primary); font-size:0.8rem;">${escapeHtml(job.employerName)}</div>
                        <div style="display:flex; gap:0.75rem; font-size:0.7rem; color:var(--gray); margin:0.5rem 0;"><span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span><span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary)}</span><span><i class="fas fa-clock"></i> ${getTimeAgo(job.timestamp)}</span></div></div></div>
                        <div style="display:flex; gap:0.75rem; margin-top:1rem;"><button class="save-job" data-id="${job.id}" style="flex:1; padding:0.5rem; background:var(--light); border:1px solid var(--border); border-radius:0.5rem;"><i class="fas fa-bookmark"></i> ${savedJobsSet.has(job.id)?'Saved':'Save'}</button><button class="apply-job" data-id="${job.id}" style="flex:1; padding:0.5rem; background:var(--gradient); border:none; border-radius:0.5rem; color:white;">Apply</button></div>
                    </div>
                `).join('');
                container.innerHTML=reset?html:container.innerHTML+html;
                if(hasMoreJobs&&!reset){
                    const btn=document.createElement("button"); btn.textContent="Load More Jobs"; btn.className="btn-primary"; btn.style.width="auto"; btn.style.padding="0.5rem 1rem"; btn.onclick=()=>loadJobs(false);
                    container.appendChild(btn);
                }
                document.querySelectorAll('.save-job').forEach(btn=>btn.onclick=()=>toggleSaveJob(btn.dataset.id));
                document.querySelectorAll('.apply-job').forEach(btn=>{
                    btn.onclick=async()=>{
                        btn.disabled=true; btn.textContent="Applying...";
                        try{
                            const existing=await getDocs(query(applicationsCol, where("jobId","==",btn.dataset.id), where("applicantId","==",currentUser.uid)));
                            if(!existing.empty){ showToast("Already applied"); btn.disabled=false; btn.textContent="Apply"; return; }
                            await addDoc(applicationsCol,{jobId:btn.dataset.id,applicantId:currentUser.uid,status:"applied",appliedAt:Timestamp.now()});
                            showToast("Applied! 🎉");
                        }catch(e){ showToast("Error applying",true); }
                        btn.disabled=false; btn.textContent="Apply";
                    };
                });
            }catch(e){ console.error(e); showToast("Failed to load jobs",true); }
            isLoadingJobs=false;
        }

        function setupSearch(){
            const inp=document.getElementById("jobSearchInput");
            if(!inp) return;
            inp.addEventListener("input",(e)=>{
                clearTimeout(searchTimeout);
                searchTimeout=setTimeout(()=>{ searchKeyword=e.target.value; loadJobs(); },300);
            });
        }

        function showPostJobModal(){
            const modal=document.createElement("div"); modal.className="modal active";
            modal.innerHTML=`<div class="modal-content"><h3>Post a Job</h3><input id="jobTitle" placeholder="Job Title"><input id="companyName" placeholder="Company"><input id="jobLocation" placeholder="Location"><input id="jobSalary" placeholder="Salary"><textarea id="jobDesc" rows="4" placeholder="Description"></textarea><button id="submitJob" class="btn-primary">Post Job</button><button class="close-modal" style="margin-top:0.5rem;">Cancel</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector("#submitJob").onclick=async()=>{
                const title=modal.querySelector("#jobTitle").value, company=modal.querySelector("#companyName").value, loc=modal.querySelector("#jobLocation").value, salary=modal.querySelector("#jobSalary").value, desc=modal.querySelector("#jobDesc").value;
                if(!title||!company||!loc||!desc) return showToast("Fill all fields",true);
                const btn=modal.querySelector("#submitJob"); btn.disabled=true; btn.textContent="Posting...";
                try{
                    await addDoc(jobsCol,{title,employerName:company,location:loc,salary,description:desc,employerId:currentUser.uid,timestamp:Timestamp.now()});
                    showToast("Job posted!");
                    modal.remove(); loadJobs();
                }catch(e){ showToast("Error",true); btn.disabled=false; btn.textContent="Post Job"; }
            };
            modal.querySelector(".close-modal").onclick=()=>modal.remove();
        }

        // Chat system – auto create room on first message
        let chatUnsub=null, currentChatId=null;
        async function getOrCreateChat(otherUserId) {
            const existing = await getDocs(query(chatsCol, where("participants","array-contains",currentUser.uid)));
            for(const docSnap of existing.docs){
                const participants = docSnap.data().participants;
                if(participants.includes(otherUserId)) return docSnap.id;
            }
            const newChat = await addDoc(chatsCol, {
                participants: [currentUser.uid, otherUserId],
                lastMessage: "",
                updatedAt: Timestamp.now(),
                createdAt: Timestamp.now()
            });
            return newChat.id;
        }

        async function loadChats(){
            const container=document.getElementById("chatsContainer");
            if(!container) return;
            container.innerHTML=`<div class="loader"></div>`;
            try{
                const snap=await getDocs(query(chatsCol, where("participants","array-contains",currentUser.uid), orderBy("updatedAt","desc")));
                const chats=snap.docs.map(d=>({id:d.id,...d.data()}));
                if(chats.length===0){ container.innerHTML=`<div class="empty-state"><i class="fas fa-comments"></i><p>No messages yet. Start a conversation from a job detail or follow a user.</p></div>`; return; }
                const chatsWithNames=await Promise.all(chats.map(async c=>{
                    const otherId=c.participants.find(p=>p!==currentUser.uid);
                    const u=await getUserData(otherId);
                    return {...c, otherUser:{id:otherId, name:u?.name||'User'}};
                }));
                container.innerHTML=`<div class="card" style="padding:0;">${chatsWithNames.map(c=>`
                    <div class="chat-item" data-chat-id="${c.id}" data-user-id="${c.otherUser.id}" style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem; border-bottom:1px solid var(--border); cursor:pointer;">
                        <div style="width:40px; height:40px; background:var(--gradient); border-radius:50%; display:flex; align-items:center; justify-content:center;">${escapeHtml(c.otherUser.name?.charAt(0)||'U')}</div>
                        <div style="flex:1;"><strong>${escapeHtml(c.otherUser.name)}</strong><br><span style="font-size:0.7rem;">${escapeHtml(c.lastMessage||'No messages')}</span></div>
                        <div style="font-size:0.7rem;">${getTimeAgo(c.updatedAt)}</div>
                    </div>
                `).join('')}</div>`;
                document.querySelectorAll('.chat-item').forEach(el=>el.onclick=()=>openChat(el.dataset.chatId, el.dataset.userId));
            }catch(e){
                console.warn(e);
                container.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading chats. Try again later.</p></div>`;
            }
        }

        async function openChat(chatId, otherUserId){
            currentChatId=chatId;
            const chatArea=document.getElementById("chatAreaView");
            const otherUser=await getUserData(otherUserId);
            chatArea.innerHTML=`<div class="card" style="padding:0; height:70vh; display:flex; flex-direction:column;">
                <div style="padding:1rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:0.75rem;">
                    <button id="backToChats" style="background:none; border:none;"><i class="fas fa-arrow-left"></i></button>
                    <div style="width:40px; height:40px; background:var(--gradient); border-radius:50%; display:flex; align-items:center; justify-content:center;">${escapeHtml(otherUser?.name?.charAt(0)||'U')}</div>
                    <strong>${escapeHtml(otherUser?.name)}</strong>
                </div>
                <div id="chatMessages" style="flex:1; overflow-y:auto; padding:1rem;"></div>
                <div style="display:flex; gap:0.5rem; padding:1rem; border-top:1px solid var(--border);">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendMsg">Send</button>
                </div>
            </div>`;
            document.getElementById("backToChats").onclick=()=>{ if(chatUnsub) chatUnsub(); loadChats(); chatArea.innerHTML=""; currentChatId=null; };
            if(chatUnsub) chatUnsub();
            chatUnsub=onSnapshot(query(messagesCol, where("chatId","==",chatId), orderBy("createdAt","asc")),(snap)=>{
                const msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
                const msgDiv=document.getElementById("chatMessages");
                if(msgDiv){
                    msgDiv.innerHTML=msgs.map(m=>`
                        <div style="display:flex; justify-content:${m.senderId===currentUser.uid?'flex-end':'flex-start'}; margin-bottom:0.5rem;">
                            <div style="max-width:70%; padding:0.6rem 1rem; border-radius:1rem; background:${m.senderId===currentUser.uid?'var(--gradient)':'var(--light)'};">${escapeHtml(m.text)}<div style="font-size:0.6rem;">${getTimeAgo(m.createdAt)}</div></div>
                        </div>
                    `).join('');
                    msgDiv.scrollTop=msgDiv.scrollHeight;
                }
                const batch=writeBatch(db);
                msgs.forEach(m=>{ if(m.senderId!==currentUser.uid && !m.read) batch.update(doc(messagesCol,m.id),{read:true}); });
                batch.commit();
            });
            document.getElementById("sendMsg").onclick=async()=>{
                const inp=document.getElementById("messageInput");
                const text=inp.value.trim();
                if(!text) return;
                inp.disabled=true;
                try{
                    await addDoc(messagesCol,{chatId,senderId:currentUser.uid,text,read:false,createdAt:Timestamp.now()});
                    await updateDoc(doc(chatsCol,chatId),{lastMessage:text,updatedAt:Timestamp.now()});
                    inp.value="";
                }catch(e){ showToast("Send failed",true); }
                inp.disabled=false;
            };
        }

        // Profile
        async function loadProfile(){
            const container=document.getElementById("profileContainer");
            if(!container) return;
            const user=currentUserData;
            container.innerHTML=`
                <div class="card" style="text-align:center;">
                    <div style="width:80px; height:80px; background:var(--gradient); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 1rem;">${escapeHtml(user?.name?.charAt(0)||'U')}</div>
                    <h2>${escapeHtml(user?.name)}</h2>
                    <p style="color:var(--gray);">${escapeHtml(user?.title||'Professional')}</p>
                    <p>${escapeHtml(user?.bio||'No bio yet')}</p>
                    <button id="editProfileBtn" class="btn-primary">Edit Profile</button>
                    <button onclick="window.toggleTheme()" class="btn-primary" style="margin-top:0.5rem;">Dark Mode</button>
                </div>
                <div class="card"><h3>My Applications</h3><div id="myAppsList">Loading...</div></div>
            `;
            try{
                const appsSnap=await getDocs(query(applicationsCol, where("applicantId","==",currentUser.uid)));
                const apps=[];
                for(const a of appsSnap.docs){
                    const job=await getDoc(doc(jobsCol,a.data().jobId));
                    if(job.exists()) apps.push({...a.data(),job:job.data()});
                }
                if(apps.length===0) document.getElementById("myAppsList").innerHTML="<p>No applications yet</p>";
                else document.getElementById("myAppsList").innerHTML=apps.map(a=>`<div><strong>${escapeHtml(a.job.title)}</strong><br>${escapeHtml(a.job.employerName)} • <span style="background:var(--success); color:white; padding:0.2rem 0.5rem; border-radius:1rem;">${a.status||'applied'}</span></div>`).join('');
            }catch(e){ document.getElementById("myAppsList").innerHTML="<p>Error loading applications</p>"; }
            document.getElementById("editProfileBtn").onclick=()=>{
                const bio=prompt("Bio:",user?.bio||""); const title=prompt("Title:",user?.title||"");
                if(bio!==null) updateDoc(doc(usersCol,currentUser.uid),{bio});
                if(title!==null) updateDoc(doc(usersCol,currentUser.uid),{title});
                if(bio!==null||title!==null) loadProfile();
            };
        }

        // Notifications
        async function loadNotifications(){
            const container=document.getElementById("notificationsContainer");
            if(!container) return;
            container.innerHTML=`<div class="loader"></div>`;
            try{
                const snap=await getDocs(query(notificationsCol, where("userId","==",currentUser.uid), orderBy("createdAt","desc"), limit(30)));
                const notifs=snap.docs.map(d=>({id:d.id,...d.data()}));
                if(notifs.length===0){ container.innerHTML=`<div class="empty-state"><i class="fas fa-bell"></i><p>No notifications</p></div>`; return; }
                container.innerHTML=notifs.map(n=>`<div class="card"><div style="font-weight:600;">${escapeHtml(n.title)}</div><div>${escapeHtml(n.message)}</div><div style="font-size:0.7rem; color:var(--gray);">${getTimeAgo(n.createdAt)}</div></div>`).join('');
                const batch=writeBatch(db);
                snap.docs.forEach(d=>{ if(!d.data().read) batch.update(d.ref,{read:true}); });
                await batch.commit();
            }catch(e){
                console.warn(e);
                container.innerHTML=`<div class="empty-state"><i class="fas fa-bell"></i><p>No notifications yet</p></div>`;
            }
        }

        // Main render
        async function renderMainApp(){
            currentUserData=await getUserData(currentUser.uid);
            const isEmployer=currentUserData?.role==='Employer';
            document.getElementById("app").innerHTML=`
                <nav class="navbar"><div class="logo">JobLink</div><div style="display:flex; gap:0.5rem;">${isEmployer?'<button id="postJobBtn" style="background:var(--gradient); border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white;">Post Job</button>':''}<button id="themeToggle" style="background:var(--light); border:1px solid var(--border); padding:0.5rem 0.8rem; border-radius:0.75rem;"><i class="fas fa-moon"></i></button><button class="logout-btn" style="background:var(--danger); border:none; padding:0.5rem 1rem; border-radius:0.75rem; color:white;">Logout</button></div></nav>
                <div class="bottom-nav">
                    <button data-nav="jobs" class="active"><i class="fas fa-briefcase"></i><span>Jobs</span></button>
                    <button data-nav="feed"><i class="fas fa-home"></i><span>Feed</span></button>
                    <button data-nav="messages"><i class="fas fa-comment"></i><span>Chat</span></button>
                    <button data-nav="profile"><i class="fas fa-user"></i><span>Profile</span></button>
                    <button data-nav="notifications"><i class="fas fa-bell"></i><span>Alerts</span></button>
                </div>
                <div class="container">
                    <div id="jobsView" class="view active"><div class="search-bar"><input type="text" id="jobSearchInput" class="search-input" placeholder="🔍 Search jobs..."></div><div class="filters" style="display:flex; gap:0.5rem; margin-bottom:1rem;"><span class="filter-chip" data-filter="all" style="padding:0.3rem 1rem; background:var(--gradient); color:white; border-radius:2rem;">All</span><span class="filter-chip" data-filter="remote" style="padding:0.3rem 1rem; background:var(--light); border:1px solid var(--border); border-radius:2rem;">Remote</span></div><div id="jobsContainer"></div></div>
                    <div id="feedView" class="view"><div id="feedContainer"></div><div class="card" style="text-align:center;"><button id="createPostBtn" class="btn-primary">+ Create Post</button></div></div>
                    <div id="messagesView" class="view"><div id="chatsContainer"></div><div id="chatAreaView"></div></div>
                    <div id="profileView" class="view"><div id="profileContainer"></div></div>
                    <div id="notificationsView" class="view"><div id="notificationsContainer"></div></div>
                </div>
            `;
            document.querySelectorAll('.bottom-nav button').forEach(btn=>btn.onclick=()=>navigateTo(btn.dataset.nav));
            document.querySelector(".logout-btn").onclick=()=>signOut(auth);
            document.getElementById("postJobBtn")?.addEventListener("click",showPostJobModal);
            document.getElementById("themeToggle").onclick=()=>window.toggleTheme();
            document.getElementById("createPostBtn")?.addEventListener("click",async()=>{
                const content=prompt("What's on your mind?");
                if(content){
                    await addDoc(postsCol,{content,authorId:currentUser.uid,authorName:currentUserData?.name,timestamp:Timestamp.now(),likesCount:0,commentsCount:0});
                    showToast("Post created!");
                    loadFeed();
                }
            });
            setupSearch();
            document.querySelectorAll('.filter-chip').forEach(chip=>{
                chip.onclick=()=>{
                    currentFilter=chip.dataset.filter;
                    document.querySelectorAll('.filter-chip').forEach(c=>{c.style.background="var(--light)"; c.style.color="var(--dark)"; chip.style.background="var(--gradient)"; chip.style.color="white";});
                    loadJobs();
                };
            });
            await loadSavedJobsSet();
            await refreshLikesCache();
            await loadJobs();
            await loadFeed();
            await loadProfile();
            await loadChats();
            await loadNotifications();
            navigateTo("jobs");
        }

        function renderDashboard(){ if(!currentUser) return renderAuthScreen(); renderMainApp(); }
        onAuthStateChanged(auth,async(user)=>{
            if(user){
                currentUser=user;
                const ref=doc(usersCol,user.uid);
                if(!(await getDoc(ref)).exists()) await setDoc(ref,{name:user.email.split('@')[0],email:user.email,role:"Job Seeker",createdAt:Timestamp.now(),bio:"",title:"",skills:[]});
                renderDashboard();
            }else{ renderAuthScreen(); }
        });
    </script>
</body>
</html>
